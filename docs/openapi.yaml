\# API Reference — Commit \`6712223\` This reference documents the public TypeScript symbols added or modified in this change. Internal helpers, test fixtures, and unexported constants are excluded. --- ## \`NotionCrawler\` \*\*Class\*\* · \`class NotionCrawler implements TargetCrawler\` Crawls a Notion workspace starting from a configured root page and builds a graph of documentation nodes and edges. ### \`crawl(deploymentConfig, onProgress?)\` \`\`\`ts async crawl( deploymentConfig: Record, onProgress?: (nodesDiscovered: number) => void, ): Promise \`\`\` Starts a recursive crawl from the root Notion page specified in \`deploymentConfig\`. Calls \`onProgress\` after each page is discovered. #### Parameters | Name | Type | Required | Description | |---|---|---|---| | \`deploymentConfig\` | \`Record\` | Yes | Target-specific configuration. Must include at least \`pageId\` (string) — the root Notion page to start crawling from. | | \`onProgress\` | \`(nodesDiscovered: number) => void\` | No | Callback invoked each time a new node is discovered. Receives the running total of nodes found. | #### Returns \`Promise\` — resolved when the crawl is complete. --- ## \`CrawlNode\` \*\*Interface\*\* · \`interface CrawlNode\` Represents a single discovered documentation page or section within a crawl result. --- ## \`CrawlEdge\` \*\*Interface\*\* · \`interface CrawlEdge\` Represents a directed relationship between two \`CrawlNode\` instances discovered during a crawl. --- ## \`CrawlResult\` \*\*Interface\*\* · \`interface CrawlResult\` The complete output of a \`NotionCrawler.crawl()\` call, containing arrays of discovered nodes and edges. --- ## \`TargetCrawler\` \*\*Interface\*\* · \`interface TargetCrawler\` Contract that every crawler implementation must satisfy. \`NotionCrawler\` implements this interface. --- ## \`MintlifyIntegration\` \*\*Class\*\* · \`class MintlifyIntegration implements DocIntegration\` Publishes approved documentation drafts to a Mintlify-backed GitHub repository as \`.mdx\` files and keeps \`docs.json\` navigation in sync. ### \`push(draft, node, deploymentConfig)\` \`\`\`ts async push( draft: ApprovedDraft, node: IntegrationNode | null, deploymentConfig: Record, ): Promise \`\`\` Writes an approved draft to the Mintlify repository. When \`node\` is \`null\` (first deployment) a new \`.mdx\` file is created; when \`node\` carries an existing \`externalDocId\` the relevant \`##\` section is surgically updated. #### Parameters | Name | Type | Required | Description | |---|---|---|---| | \`draft\` | \`ApprovedDraft\` | Yes | The approved documentation draft to publish. | | \`node\` | \`IntegrationNode \\| null\` | Yes | Prior deployment state for this document. Pass \`null\` for first-time deployments. | | \`deploymentConfig\` | \`Record\` | Yes | Mintlify-specific config. Expected keys: \`repo\` (string, \`owner/repo\`), \`branch\` (string), \`basePath\` (string). | #### Returns \`Promise\` --- ### \`fetchContentHash(deploymentConfig)\` \`\`\`ts async fetchContentHash(deploymentConfig: Record): Promise \`\`\` Returns a short hash of the current published content, or \`null\` if the file does not yet exist. #### Parameters | Name | Type | Required | Description | |---|---|---|---| | \`deploymentConfig\` | \`Record\` | Yes | Mintlify-specific deployment configuration. | #### Returns \`Promise\` --- ### \`fetchContent(deploymentConfig)\` \`\`\`ts async fetchContent(deploymentConfig: Record): Promise \`\`\` Returns the raw content of the deployed file, or \`null\` if it does not exist. #### Parameters | Name | Type | Required | Description | |---|---|---|---| | \`deploymentConfig\` | \`Record\` | Yes | Mintlify-specific deployment configuration. | #### Returns \`Promise\` --- ## \`NotionIntegration\` \*\*Class\*\* · \`class NotionIntegration implements DocIntegration\` Publishes approved documentation drafts to Notion pages and performs surgical section-level updates. ### \`push(draft, node, deploymentConfig)\` \`\`\`ts async push( draft: ApprovedDraft, node: IntegrationNode | null, deploymentConfig: Record, ): Promise \`\`\` Writes an approved draft to a Notion page. When \`node\` is \`null\` a new child page is created; when \`node\` carries an existing \`externalDocId\` the matching \`## heading\_2\` section is replaced in place. #### Parameters | Name | Type | Required | Description | |---|---|---|---| | \`draft\` | \`ApprovedDraft\` | Yes | The approved documentation draft to publish. | | \`node\` | \`IntegrationNode \\| null\` | Yes | Prior deployment state. Pass \`null\` for first-time deployments. | | \`deploymentConfig\` | \`Record\` | Yes | Notion-specific config. Expected key: \`pageId\` (string) — parent Notion page ID. | #### Returns \`Promise\` --- ### \`fetchContentHash(deploymentConfig)\` \`\`\`ts async fetchContentHash(deploymentConfig: Record): Promise \`\`\` Returns a short hash of the current Notion page content, or \`null\` if it cannot be retrieved. #### Parameters | Name | Type | Required | Description | |---|---|---|---| | \`deploymentConfig\` | \`Record\` | Yes | Notion-specific deployment configuration. | #### Returns \`Promise\` --- ### \`fetchContent(deploymentConfig)\` \`\`\`ts async fetchContent(deploymentConfig: Record): Promise \`\`\` Returns the current Notion page content as Markdown, or \`null\` if it cannot be retrieved. #### Parameters | Name | Type | Required | Description | |---|---|---|---| | \`deploymentConfig\` | \`Record\` | Yes | Notion-specific deployment configuration. | #### Returns \`Promise\` --- ## \`DocIntegration\` \*\*Interface\*\* · \`interface DocIntegration\` Every deployment target implements this interface. The deployment pipeline calls \`push()\`, \`fetchContentHash()\`, and \`fetchContent()\` without knowing the underlying target. The \`deploymentConfig\` shape is target-specific. \`\`\`ts interface DocIntegration { push(draft: ApprovedDraft, node: IntegrationNode | null, deploymentConfig: Record): Promise; fetchContentHash(deploymentConfig: Record): Promise; fetchContent(deploymentConfig: Record): Promise; } \`\`\` --- ## \`ApprovedDraft\` \*\*Interface\*\* · \`interface ApprovedDraft\` Minimal representation of an approved \`DocDraft\` passed to every integration's \`push()\` method. --- ## \`IntegrationNode\` \*\*Interface\*\* · \`interface IntegrationNode\` Bridge between the current \`DocBaseline\` model and the future \`KnowledgeGraphNode\`. You pass this to every integration's \`push()\` so integrations can decide whether to create or update, and what context to carry forward. Pass \`null\` to signal first deployment with no prior state. --- ## \`DeployResult\` \*\*Interface\*\* · \`interface DeployResult\` Value returned by \`DocIntegration.push()\`. Contains at minimum a content hash and any platform-specific identifiers set after the push completes. --- ## \`contentHash(content)\` \`\`\`ts function contentHash(content: string): string \`\`\` Computes a short deterministic hash of a content string. Use the return value to populate \`DeployResult.contentHash\`. #### Parameters | Name | Type | Required | Description | |---|---|---|---| | \`content\` | \`string\` | Yes | The raw content string to hash. | #### Returns \`string\` — a short hex hash. --- ## \`proposeSkeleton(orgId, targetId, docType, deploymentTarget)\` \`\`\`ts async function proposeSkeleton( orgId: string, targetId: string, docType: string, deploymentTarget: string, ): Promise \`\`\` Generates a proposed documentation skeleton for a blank target. Creates \`KnowledgeGraphNode\` records with \`structureSource: 'syscribe\_default'\` and advances the \`TargetOnboardingState\` status to \`'awaiting\_skeleton'\`. #### Parameters | Name | Type | Required | Description | |---|---|---|---| | \`orgId\` | \`string\` | Yes | Organisation identifier. | | \`targetId\` | \`string\` | Yes | Target (documentation destination) identifier. | | \`docType\` | \`string\` | Yes | Documentation type — one of \`INTERNAL\`, \`USER\_FACING\`, or \`API\`. | | \`deploymentTarget\` | \`string\` | Yes | Platform identifier, e.g. \`notion\`, \`mintlify\`, \`github\_pages\`. | #### Returns \`Promise\` — proposed nodes ordered for display, each representing a page or section in the skeleton. #### Example \`\`\`ts const nodes = await proposeSkeleton( 'org\_abc123', 'target\_xyz', 'USER\_FACING', 'mintlify', ); // nodes\[0\].sectionPath → "getting-started" \`\`\` --- ## \`confirmSkeleton(orgId, targetId, docType, deploymentTarget, deploymentConfig, excludedNodeIds)\` \`\`\`ts async function confirmSkeleton( orgId: string, targetId: string, docType: string, deploymentTarget: string, deploymentConfig: Record, excludedNodeIds: string\[\], ): Promise<{ nodesConfirmed: number }> \`\`\` Confirms a proposed skeleton. Promotes all \`syscribe\_default\` nodes to \`user\_confirmed\`, deletes any excluded nodes, scaffolds stub content in the actual deployment target (Notion or Mintlify), and advances \`TargetOnboardingState.status\` to \`'complete'\`. #### Parameters | Name | Type | Required | Description | |---|---|---|---| | \`orgId\` | \`string\` | Yes | Organisation identifier. | | \`targetId\` | \`string\` | Yes | Target identifier. | | \`docType\` | \`string\` | Yes | Documentation type — one of \`INTERNAL\`, \`USER\_FACING\`, or \`API\`. | | \`deploymentTarget\` | \`string\` | Yes | Platform identifier, e.g. \`notion\`, \`mintlify\`. | | \`deploymentConfig\` | \`Record\` | Yes | Target-specific deployment configuration (same shape as supplied to \`DocIntegration.push()\`). | | \`excludedNodeIds\` | \`string\[\]\` | Yes | IDs of proposed nodes the user wants to exclude. Pass an empty array to accept all proposed nodes. | #### Returns \`Promise<{ nodesConfirmed: number }>\` — an object containing the count of nodes that were confirmed and scaffolded. #### Example \`\`\`ts const result = await confirmSkeleton( 'org\_abc123', 'target\_xyz', 'USER\_FACING', 'mintlify', { repo: 'acme/docs', branch: 'main', basePath: 'docs/' }, \['node\_id\_to\_skip'\], ); console.log(result.nodesConfirmed); // e.g. 7 \`\`\` --- ## \`ProposedNode\` \*\*Interface\*\* · \`interface ProposedNode\` (server-side, from \`proposeSkeleton\` module) Represents a single page or section node in a proposed documentation skeleton, as returned by \`proposeSkeleton()\`. --- ## \`getSkeletonTemplate(docType, deploymentTarget)\` \`\`\`ts function getSkeletonTemplate( docType: string, deploymentTarget: string, ): SkeletonTemplate | null \`\`\` Returns the built-in skeleton template for a given \`docType\` × \`deploymentTarget\` combination, or \`null\` when no template is defined (in which case the user should build their own structure). #### Parameters | Name | Type | Required | Description | |---|---|---|---| | \`docType\` | \`string\` | Yes | Documentation type — one of \`INTERNAL\`, \`USER\_FACING\`, or \`API\`. | | \`deploymentTarget\` | \`string\` | Yes | Platform identifier, e.g. \`notion\`, \`mintlify\`, \`github\_pages\`. | #### Returns \`SkeletonTemplate | null\` #### Example \`\`\`ts const template = getSkeletonTemplate('USER\_FACING', 'mintlify'); if (template) { console.log(template.pages); // Array of PageDef } \`\`\` --- ## \`SkeletonTemplate\` \*\*Interface\*\* · \`interface SkeletonTemplate\` Defines the structure of a built-in skeleton template returned by \`getSkeletonTemplate()\`. --- ## \`PageDef\` \*\*Interface\*\* · \`interface PageDef\` Describes a page node within a \`SkeletonTemplate\`, including its title, sections, and any child pages. --- ## \`SectionDef\` \*\*Interface\*\* · \`interface SectionDef\` Describes a section (sub-heading) within a \`PageDef\`. --- ## \`SkeletonProposalServerPage\` \*\*Function\*\* · Next.js Server Page component \`\`\`ts async function SkeletonProposalServerPage({ params, }: { params: Promise<{ id: string; docType: string }>; }) \`\`\` Next.js server page that renders the skeleton proposal UI for a specific target and doc type. Reads \`id\` (target ID) and \`docType\` from route parameters. #### Parameters | Name | Type | Required | Description | |---|---|---|---| | \`params\` | \`Promise<{ id: string; docType: string }>\` | Yes | Next.js route params containing the target \`id\` and \`docType\` (one of \`INTERNAL\`, \`USER\_FACING\`, \`API\`). | --- ## Prisma Client ### \`PrismaClient\` \`\`\`ts interface PrismaClient< in LogOpts extends Prisma.LogLevel = never, in out OmitOpts extends Prisma.PrismaClientOptions\['omit'\] = undefined, in out ExtArgs extends runtime.Types.Extensions.InternalArgs = runtime.Types.Extensions.DefaultArgs > \`\`\` Type-safe database client for TypeScript. Instantiate it with a database adapter and use it to query your database models. \`\`\`ts const prisma = new PrismaClient({ adapter: new PrismaPg({ connectionString: process.env.DATABASE\_URL }) }) const orgs = await prisma.org.findMany() \`\`\` See the \[Prisma docs\](https://pris.ly/d/client) for full details. --- ### \`getPrismaClientClass()\` \`\`\`ts function getPrismaClientClass(): PrismaClientConstructor \`\`\` Returns the \`PrismaClient\` constructor. Use this when you need to access the constructor dynamically (e.g. in edge runtimes where top-level instantiation is deferred). #### Returns \`PrismaClientConstructor\` --- ### \`PrismaClientConstructor\` \*\*Interface\*\* · \`interface PrismaClientConstructor\` The constructor type for \`PrismaClient\`. Returned by \`getPrismaClientClass()\`. --- ### \`LogOptions\` \`\`\`ts type LogOptions = … \`\`\` Utility type that resolves the effective log level options from a given \`PrismaClientOptions\` type. --- ### Error Classes Each error class is both a runtime value (throwable/catchable) and a TypeScript type. | Export | Description | |---|---| | \`PrismaClientKnownRequestError\` | Thrown when a query fails with a known Prisma error code. | | \`PrismaClientUnknownRequestError\` | Thrown when a query fails with an unrecognised engine error. | | \`PrismaClientRustPanicError\` | Thrown when the underlying Rust query engine panics. | | \`PrismaClientInitializationError\` |