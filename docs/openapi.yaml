\# Documentation: Commit \`d0289fa6b00592e79b7cec8cf85f41c05ecd6c9a\` This commit introduces knowledge graph context support for draft generation, a new staleness-checking subsystem for KG nodes, and several supporting type changes. The sections below document all \*\*public\*\* symbols that were added or meaningfully changed. --- ## Table of Contents 1. \[Types & Interfaces — Generation\](#types--interfaces--generation) - \[\`DocType\`\](#doctype) - \[\`KGContext\`\](#kgcontext) - \[\`EditHistoryExample\`\](#edithistoryexample) - \[\`CommitEventRef\`\](#commiteventref) - \[\`GenerateDraftsInput\`\](#generatedraftsinput) - \[\`DocDraftResult\`\](#docdraftresult) - \[\`ChangelogEntryResult\`\](#changelogentryresult) - \[\`GenerateDraftsResult\`\](#generatedraftsresult) 2. \[Functions — Generation\](#functions--generation) - \[\`generateDrafts\`\](#generatedrafts) 3. \[Types & Interfaces — Staleness Checking\](#types--interfaces--staleness-checking) - \[\`StalenessCheckResult\`\](#stalenesscheckresult) 4. \[Functions — Staleness Checking\](#functions--staleness-checking) - \[\`checkStaleness\`\](#checkstaleness) 5. \[Worker Exports\](#worker-exports) - \[\`generateDraftsWorker\`\](#generatedraftsworker) - \[\`crawlTargetWorker\`\](#crawltargetworker) - \[\`deployDraftWorker\`\](#deploydraftworker) --- ## Types & Interfaces — Generation ### \`DocType\` \`\`\`ts type DocType = 'INTERNAL' | 'USER\_FACING' | 'API'; \`\`\` A discriminated string union representing the three categories of documentation that the generation pipeline can produce. | Value | Description | |---|---| | \`'INTERNAL'\` | Internal engineering documentation | | \`'USER\_FACING'\` | End-user product documentation | | \`'API'\` | API reference documentation | --- ### \`KGContext\` \`\`\`ts interface KGContext \`\`\` \*\*Added in this commit.\*\* Knowledge graph context for a specific doc type. Passed by the \`generate-drafts\` worker when KG nodes are found. When present, it is used \*\*instead of\*\* a \`DocBaseline\` as the generation context. > This interface is typically constructed by the worker before calling \`generateDrafts\`. Its fields are not yet fully documented in the diff; refer to the worker implementation for the current shape. --- ### \`EditHistoryExample\` \`\`\`ts interface EditHistoryExample \`\`\` Represents a past human edit retrieved from a pgvector similarity search. Injected into the generation prompt so the model learns the team's writing style. > Field definitions are inferred from worker usage. Update this table when the interface fields are stabilised. | Field | Type | Description | |---|---|---| | \*(varies)\* | \*(varies)\* | Fields from the pgvector similarity search result | --- ### \`CommitEventRef\` \`\`\`ts interface CommitEventRef \`\`\` Minimal subset of \`CommitEvent\` fields required by the generation pipeline. Accepts both a real Prisma \`CommitEvent\` object and a test mock, making it suitable for use in \`scripts/test-generate.ts\`. --- ### \`GenerateDraftsInput\` \`\`\`ts interface GenerateDraftsInput \`\`\` Input bag passed to \[\`generateDrafts\`\](#generatedrafts). | Field | Type | Required | Description | |---|---|---|---| | \`commitEvent\` | \`CommitEventRef\` | ✅ | The commit event to generate documentation for | | \`parsedDiff\` | \`ParsedDiff\` | ✅ | Parsed representation of the code diff | | \`editHistory\` | \`EditHistoryExample\[\]\` | ✅ | Past edits for style injection | | \`docTypes\` | \`DocType\[\]\` | ✅ | Doc types to generate (subset of \`\['INTERNAL','USER\_FACING','API'\]\`) | | \`kgContext\` | \`KGContext\` \\| \`undefined\` | ❌ | Optional knowledge graph context; replaces baseline when provided | --- ### \`DocDraftResult\` \`\`\`ts interface DocDraftResult \`\`\` Result for a single generated doc type. Always contains the generated content; contains the database record \`id\` only when the DB write succeeded. | Field | Type | Description | |---|---|---| | \`docType\` | \`DocType\` | Which doc type this result is for | | \`content\` | \`string\` | Generated markdown content | | \`confidenceScore\` | \`number\` | Model confidence score, \`0.0\`–\`1.0\` | | \`id\` | \`string\` \\| \`undefined\` | Postgres record ID; absent if DB write failed | --- ### \`ChangelogEntryResult\` \`\`\`ts interface ChangelogEntryResult \`\`\` Result for the changelog entry generated after all doc drafts complete. | Field | Type | Description | |---|---|---| | \`summary\` | \`string\` | One-sentence summary of the change | | \`affectedSymbols\` | \`string\[\]\` | Symbol names mentioned in the changelog | | \`id\` | \`string\` \\| \`undefined\` | Postgres record ID; absent if DB write failed | --- ### \`GenerateDraftsResult\` \`\`\`ts interface GenerateDraftsResult \`\`\` Aggregate result returned by \[\`generateDrafts\`\](#generatedrafts), regardless of whether any DB writes succeeded. | Field | Type | Description | |---|---|---| | \`drafts\` | \`DocDraftResult\[\]\` | One entry per requested \`DocType\` | | \`changelog\` | \`ChangelogEntryResult\` | The generated changelog entry | | \`totalInputTokens\` | \`number\` | Sum of input tokens across all LLM calls | | \`totalOutputTokens\` | \`number\` | Sum of output tokens across all LLM calls | --- ## Functions — Generation ### \`generateDrafts\` \`\`\`ts async function generateDrafts(input: GenerateDraftsInput): Promise \`\`\` Generates documentation drafts and a changelog entry for a \`CommitEvent\`. \*\*Behaviour\*\* - Generates one \`DocDraft\` per \`docType\` in the input, in sequence. - Persists each draft to Postgres immediately after generation. DB write failures are caught and surfaced in the result — they do \*\*not\*\* abort remaining generations. - Generates a \`ChangelogEntry\` after all doc drafts complete. - Returns a \`GenerateDraftsResult\` containing all generated content and aggregate token usage, regardless of whether DB writes succeeded. > When used in \`scripts/test-generate.ts\` with a mock \`commitEvent\` that has no real DB record, DB writes will fail with FK constraint errors. These are caught internally; content and token usage are always returned. \*\*Parameters\*\* | Name | Type | Required | Description | |---|---|---|---| | \`input\` | \`GenerateDraftsInput\` | ✅ | Input containing the commit event, parsed diff, edit history, doc types, and optional KG context | \*\*Returns\*\* \`Promise\` \*\*TypeScript example\*\* \`\`\`ts import { generateDrafts } from './generate'; const result = await generateDrafts({ commitEvent: { id: 'evt\_abc123', repoId: 'repo\_xyz', commitSha: 'abc123', // ... other CommitEventRef fields }, parsedDiff: parsedDiff, // ParsedDiff from your diff parser editHistory: editHistoryExamples, // EditHistoryExample\[\] from pgvector docTypes: \['INTERNAL', 'API'\], }); for (const draft of result.drafts) { console.log(\`\[${draft.docType}\] id=${draft.id ?? 'no-db-write'}\`); console.log(draft.content); } console.log('Changelog:', result.changelog.summary); console.log(\`Tokens used: ${result.totalInputTokens} in / ${result.totalOutputTokens} out\`); \`\`\` \*\*Error handling\*\* | Condition | Behaviour | |---|---| | DB FK constraint violation (e.g., mock commit event) | Caught; \`id\` field absent from the affected result | | LLM call failure | Propagates as a thrown error | | Missing \`DocBaseline\` for repo | Silently ignored; generation proceeds without a baseline | --- ## Types & Interfaces — Staleness Checking ### \`StalenessCheckResult\` \`\`\`ts interface StalenessCheckResult \`\`\` \*\*Added in this commit.\*\* Return value from \[\`checkStaleness\`\](#checkstaleness). Describes the outcome of a single staleness check against a KnowledgeGraphNode. | Field | Type | Description | |---|---|---| | \`driftDetected\` | \`boolean\` | \`true\` if the cached content no longer matches the live source | | \`cacheAgeHours\` | \`number\` | Age of the cached content in hours at check time | | \*(additional fields)\* | \*(varies)\* | Full field list follows the \`StalenessCheckOutcome\` DB schema | --- ## Functions — Staleness Checking ### \`checkStaleness\` \`\`\`ts async function checkStaleness( node: KnowledgeGraphNode, config: RepoDocConfig, ): Promise \`\`\` \*\*Added in this commit.\*\* Exported. Checks whether a \`KnowledgeGraphNode\`'s cached content is still current by fetching a live hash from the deployment target and comparing it against the node's cached state. \*\*Drift detection strategy\*\* | Target type | Hash value | Comparison | |---|---|---| | \`notion\` | \`last\_edited\_time\` string | Compared against \`node.cachedAt\` | | Git-based | Commit SHA | Compared against \`node.externalDocId\` | For Notion targets, the \`pageId\` in \`deploymentConfig\` is overridden with \`node.externalDocId\` so the check targets the specific deployed page rather than the parent container. \*\*Parameters\*\* | Name | Type | Required | Description | |---|---|---|---| | \`node\` | \`KnowledgeGraphNode\` | ✅ | The node to check. Must have \`targetId\`, \`orgId\`, \`externalDocId\`, and \`cachedAt\` populated | | \`config\` | \`RepoDocConfig\` | ✅ | The node's repo doc configuration, providing \`deploymentTarget\` and \`deploymentConfig\` | \*\*Returns\*\* \`Promise\` \*\*TypeScript example\*\* \`\`\`ts import { checkStaleness } from './staleness'; const result = await checkStaleness(node, repoDocConfig); if (result.driftDetected) { console.log(\`Drift detected after ${result.cacheAgeHours.toFixed(1)} hours\`); } else { console.log('Cache is current'); } \`\`\` \*\*Error handling\*\* | Condition | Behaviour | |---|---| | Deployment target fetch failure | Propagates as a thrown error | | \`externalDocId\` is \`null\` for Notion | Uses parent container \`pageId\` from \`deploymentConfig\` | --- ## Worker Exports ### \`generateDraftsWorker\` \`\`\`ts export const generateDraftsWorker: Worker \`\`\` BullMQ worker that consumes the \`generate-drafts\` queue. On each job it calls \[\`generateDrafts\`\](#generatedrafts) with the three standard doc types: \`\['INTERNAL', 'USER\_FACING', 'API'\]\`. #### \`GenerateDraftsJobData\` \*(internal)\* Fields are not exported; enqueued by upstream commit-event processing. --- ### \`crawlTargetWorker\` \`\`\`ts export const crawlTargetWorker: Worker \`\`\` BullMQ worker that crawls documentation targets. Includes a \`TurndownService\` instance (added in this commit) configured with ATX headings, fenced code blocks, and \`-\` bullet lists for HTML→Markdown conversion. #### \`CrawlTargetJobData\` | Field | Type | Description | |---|---|---| | \*(fields inferred from usage)\* | — | Enqueue payload for a single crawl target job | --- ### \`deployDraftWorker\` \`\`\`ts export const deployDraftWorker: Worker \`\`\` BullMQ worker that deploys approved doc drafts to their configured targets. #### \`DeployDraftJobData\` | Field | Type | Description | |---|---|---| | \*(fields inferred from usage)\* | — | Enqueue payload identifying the draft to deploy | ---