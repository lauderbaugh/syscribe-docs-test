### Modified: `extractRichText`

```ts
function extractRichText(richTextArr: unknown[]): string
```

ParameterTypeDescription`richTextArrunknown[]`Array of Notion rich-text objects (typed as `unknown` to avoid coupling to Notion SDK types at this layer)

**Returns** a concatenated plain string derived from the rich-text array. Delegates to `turndown` for any inline HTML fragments. Returns `""` for an empty array.

* * *

### Modified: `blockToMarkdown`

```ts
function blockToMarkdown(block: unknown): string
```

ParameterTypeDescription`blockunknown`A single Notion block object

**Returns** a Markdown string for the block. Unknown or unsupported block types return `""`. Uses the updated `turndown` instance.

