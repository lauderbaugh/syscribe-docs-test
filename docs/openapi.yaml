## Drafts List UI

### `DraftSummary`, `PRReviewItem`, `DraftsResponse`

Internal interfaces for the paginated drafts endpoint. `DraftsResponse` contains an array of `DraftSummary` and `PRReviewItem` entries plus pagination metadata.

* * *

### `fetchDrafts`

```ts
async function fetchDrafts(token: string, page: number): Promise<DraftsResponse | { error: string }>
```

ParameterTypeDescription`tokenstring`Bearer token`pagenumber`1-based page number; clamped to `Math.max(1, ...)` at the call site

**Returns** `DraftsResponse` or `{ error: string }`. Callers must guard on `"error" in result`.

* * *

### `statusPillConfig`

```ts
function statusPillConfig(status: DraftStatus): PillConfig
```

Maps a `DraftStatus` value to a `PillConfig` `{ label, className }` object. Exhaustive over all `DraftStatus` variants; no fallback — passing an unrecognised status is a type error.

* * *

### `DocTypePill`

```ts
function DocTypePill({ draft }: { draft: DraftSummary })
```

Renders a pill badge reflecting the `docType` of `draft`, using `DOC_TYPE_LABEL` for display text.

