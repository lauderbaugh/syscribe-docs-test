# Commit `34db1dda` — Font System Overhaul & Incremental Integration/Worker Refinements

This change touches nine files. The most visible user-facing change is a replacement of the `Inter` font with three new typefaces (`DM Sans`, `Outfit`, `JetBrains Mono`) in the root layout. The remainder of the diff reflects iterative updates to the Notion integration, the deploy-draft worker, and a range of dashboard/review UI components — signatures and types were stabilised but no structural additions were made outside the font constants.

* * *

## Font System (`app/layout.tsx`)

### Removed: `inter`

```ts
// Before
const inter = Inter({ subsets: ['latin'], variable: '--font-sans' });
```

`inter` has been **removed**. Any CSS variable `--font-sans` previously backed by Inter is no longer set by this constant. Callers referencing `inter.variable` in className strings or global CSS must be updated.

* * *

### Added: `dmSans`

```ts
const dmSans = DM_Sans({ ... });
```

Primary sans-serif body font, replacing `Inter`. Sourced from `next/font/google` via the `DM_Sans` loader. The exact subset and variable name configuration is internal to the layout file.

* * *

### Added: `outfit`

```ts
const outfit = Outfit({ ... });
```

Secondary display/heading font. Also sourced from `next/font/google`. Intended for headings or marketing-style surfaces within the app shell.

* * *

### Added: `jetbrainsMono`

```ts
const jetbrainsMono = JetBrains_Mono({ ... });
```

Monospace font replacing whatever monospace face was previously inherited. Targets code blocks, inline code, and the diff viewer surfaces (`DiffView`, `ChangeSummaryBar`).

* * *

### Modified: `RootLayout`

```ts
export function RootLayout({
  children,
}: Readonly<{
  children: React.ReactNode;
}>): JSX.Element
```

The `className` applied to `<html>` or `<body>` now references `dmSans.variable`, `outfit.variable`, and `jetbrainsMono.variable` instead of `inter.variable`. No other behaviour changed.

* * *

### Modified: `metadata`

```ts
export const metadata: Metadata = { ... }
```

Remains exported as `Metadata`. Content changes (title, description, etc.) are not described in the diff; the symbol was touched but the shape is unchanged.

* * *

