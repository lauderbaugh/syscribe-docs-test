howing what changed. | --- ## \`writeApprovalGranted\` \`\`\`typescript function writeApprovalGranted(params: { orgId: string; commitEventId?: string | null; docDraftId: string; targetId?: string | null; docType: string; userId: string; finalContent: string; diffFromGenerated: string; }): void \`\`\` Records an \`approval\_granted\` history event when a user approves a draft for deployment. ### Parameters | Parameter | Type | Required | Description | |---|---|---|---| | \`orgId\` | \`string\` | Yes | The organisation ID. | | \`commitEventId\` | \`string \\| null\` | No | The related commit event ID. | | \`docDraftId\` | \`string\` | Yes | The approved draft ID. | | \`targetId\` | \`string \\| null\` | No | Deployment target ID. | | \`docType\` | \`string\` | Yes | The doc type. | | \`userId\` | \`string\` | Yes | The user who approved. | | \`finalContent\` | \`string\` | Yes | The final approved content. | | \`diffFromGenerated\` | \`string\` | Yes | A diff showing changes made since the draft was originally generated. | --- ## \`writeApprovalBulkGranted\` \`\`\`typescript function writeApprovalBulkGranted(params: { orgId: string; commitEventId?: string | null; userId: string; approvedDocTypes: string\[\]; }): void \`\`\` Records an \`approval\_bulk\_granted\` history event when a user approves all eligible drafts for a commit at once. ### Parameters | Parameter | Type | Required | Description | |---|---|---|---| | \`orgId\` | \`string\` | Yes | The organisation ID. | | \`commitEventId\` | \`string \\| null\` | No | The related commit event ID. | | \`userId\` | \`string\` | Yes | The user who bulk-approved. | | \`approvedDocTypes\` | \`string\[\]\` | Yes | The doc types that were approved. | --- ## \`writeApprovalRejected\` \`\`\`typescript function writeApprovalRejected(params: { orgId: string; commitEventId?: string | null; docDraftId: string; targetId?: string | null; docType: string; userId: string; reason