\# \`generateDrafts\` \`\`\`typescript async function generateDrafts(input: GenerateDraftsInput): Promise \`\`\` Generates documentation drafts and a changelog entry for a \`CommitEvent\`. You call this function once per commit event — it produces one \`DocDraft\` per configured \`DocType\` in sequence, then produces a \`ChangelogEntry\`. Each draft is persisted to Postgres immediately after generation; DB write failures are captured in the result and do not abort remaining generations. --- ## Input Types ### \`GenerateDraftsInput\` | Field | Type | Required | Description | |---|---|---|---| | \`commitEvent\` | \`CommitEventRef\` | Yes | Minimal commit event fields needed for generation. Accepts a real Prisma \`CommitEvent\` or a test mock. | | \`parsedDiff\` | \`ParsedDiff\` | Yes | Parsed representation of the code diff attached to the commit. | | \`docTypes\` | \`DocType\[\]\` | Yes | The doc types to generate drafts for. | | \`editHistory\` | \`EditHistoryExample\[\]\` | Yes | Past human edits retrieved via pgvector similarity search. Injected into the prompt so the model learns your team's style. | | \`kgContext\` | \`KGContext \\| null\` | No | Knowledge graph context for the commit. When provided, replaces \`DocBaseline\` as the generation context. | ### \`CommitEventRef\` Minimal \`CommitEvent\` fields required by the generation pipeline. You can pass a real Prisma \`CommitEvent\` object or a mock for testing. | Field | Type | Required | Description | |---|---|---|---| | \`id\` | \`string\` | Yes | The commit event ID. | | \`repoId\` | \`string\` | Yes | The repository ID. | | \`commitSha\` | \`string\` | Yes | The commit SHA. | | \`orgId\` | \`string\` | Yes | The organisation ID. | ### \`EditHistoryExample\` A past human edit used to guide the model's style. | Field | Type | Required | Description | |---|---|---|---| | \`docType\` | \`DocType\` | Yes | The doc type this edit applies to. | | \`before\` | \`string\` | Yes | Content before the human edit. | | \`after\` | \`string\` | Yes | Content after the human edit. | ### \`KGContext\` Knowledge graph context for a specific doc type. When present, the generation pipeline uses this instead of \`DocBaseline\`. | Field | Type | Required | Description | |---|---|---|---| | \`docType\` | \`DocType\` | Yes | The doc type this context applies to. | | \`nodes\` | \`object\[\]\` | Yes | Knowledge graph nodes relevant to this commit. | --- ## \`DocType\` \`\`\`typescript type DocType = 'INTERNAL' | 'USER\_FACING' | 'API'; \`\`\` The three documentation surfaces the pipeline can generate for: | Value | Description | |---|---| | \`'INTERNAL'\` | Internal engineering documentation. | | \`'USER\_FACING'\` | End-user-facing documentation. | | \`'API'\` | API reference documentation. | --- ## Output Types ### \`GenerateDraftsResult\` | Field | Type | Description | |---|---|---| | \`drafts\` | \`DocDraftResult\[\]\` | One result per doc type that was generated. | | \`changelog\` | \`ChangelogEntryResult\` | The generated changelog entry. | | \`totalInputTokens\` | \`number\` | Aggregate input tokens consumed across all generations. | | \`totalOutputTokens\` | \`number\` | Aggregate output tokens consumed across all generations. | ### \`DocDraftResult\` Result for a single doc type. \`content\` is always present; \`id\` is only present when the DB write succeeded. | Field | Type | Description | |---|---|---| | \`docType\` | \`DocType\` | The doc type this draft was generated for. | | \`content\` | \`string\` | The generated draft content. Always returned even when DB write fails. | | \`id\` | \`string \\| undefined\` | The persisted \`DocDraft\` ID. Absent if the DB write failed. | | \`confidenceScore\` | \`number\` | Model-reported confidence score between \`0\` and \`1\`. Defaults to \`0.5\` when absent from the model output. | | \`inputTokens\` | \`number\` | Input tokens consumed for this draft. | | \`outputTokens\` | \`number\` | Output tokens consumed for this draft. | ### \`ChangelogEntryResult\` | Field | Type | Description | |---|---|---| | \`summary\` | \`string\` | A short human-readable summary of the change. | | \`affectedSymbols\` | \`string\[\]\` | List of symbol names affected by the commit. | | \`id\` | \`string \\| undefined\` | The persisted \`ChangelogEntry\` ID. Absent if the DB write failed. | --- ## Example \`\`\`typescript import { generateDrafts } from './generate'; const result = await generateDrafts({ commitEvent: { id: 'commit-event-uuid', repoId: 'repo-uuid', commitSha: 'abc123def456', orgId: 'org-uuid', }, parsedDiff: parsedDiff, // ParsedDiff from your diff parser docTypes: \['INTERNAL', 'USER\_FACING', 'API'\], editHistory: \[\], // Pass retrieved pgvector results here kgContext: null, }); for (const draft of result.drafts) { console.log(\`\[${draft.docType}\] id=${draft.id ?? 'DB write failed'}\`); console.log(\`Confidence: ${draft.confidenceScore}\`); console.log(draft.content); } console.log('Changelog:', result.changelog.summary); console.log('Affected symbols:', result.changelog.affectedSymbols); console.log(\`Tokens used — in: ${result.totalInputTokens}, out: ${result.totalOutputTokens}\`); \`\`\` --- --- # \`DocumentationHistoryEntry\` Model \`\`\`typescript type DocumentationHistoryEntry = Prisma.DocumentationHistoryEntryModel \`\`\` A Prisma model that records every significant event in the documentation lifecycle — draft generation, agent interactions, manual edits, approvals, and deployments. You query this model through the standard Prisma \`documentationHistoryEntry\` delegate. --- ## Model Fields | Field | Type | Required | Description | |---|---|---|---| | \`id\` | \`string\` | Yes | Unique record ID. | | \`orgId\` | \`string\` | Yes | The organisation this event belongs to. | | \`eventType\` | \`string\` | Yes | A string key identifying the event (e.g. \`"draft\_generated"\`, \`"approval\_granted"\`). | | \`commitEventId\` | \`string \\| null\` | No | The related \`CommitEvent\` ID, if applicable. | | \`docDraftId\` | \`string \\| null\` | No | The related \`DocDraft\` ID, if applicable. | | \`targetId\` | \`string \\| null\` | No | The deployment target ID, if applicable. | | \`docType\` | \`string \\| null\` | No | The doc type this event relates to. | | \`userId\` | \`string \\| null\` | No | The user who triggered the event, if applicable. | | \`payload\` | \`JsonObject\` | Yes | Arbitrary event-specific data. | | \`createdAt\` | \`DateTime\` | Yes | When the event was recorded. | --- ## Prisma Client Usage \`\`\`typescript const prisma = new PrismaClient({ adapter: new PrismaPg({ connectionString: process.env.DATABASE\_URL }) }); // Fetch recent history for a commit event const history = await prisma.documentationHistoryEntry.findMany({ where: { commitEventId: 'commit-event-uuid' }, orderBy: { createdAt: 'asc' }, }); // Fetch all approval events for an org const approvals = await prisma.documentationHistoryEntry.findMany({ where: { orgId: 'org-uuid', eventType: 'approval\_granted', }, }); \`\`\` --- ## \`DocumentationHistoryEntryScalarFieldEnum\` \`\`\`typescript const DocumentationHistoryEntryScalarFieldEnum = { ... } type DocumentationHistoryEntryScalarFieldEnum = (typeof DocumentationHistoryEntryScalarFieldEnum)\[keyof typeof DocumentationHistoryEntryScalarFieldEnum\] \`\`\` Enum of all scalar field names on the \`DocumentationHistoryEntry\` model. You use this in \`orderBy\`, \`select\`, and aggregate operations. --- --- # Documentation History Event Writers These exported functions write structured \`DocumentationHistoryEntry\` records for each documentation lifecycle event. They are fire-and-forget — each one returns \`void\` and handles DB errors internally. --- ## \`writeDraftGenerated\` \`\`\`typescript function writeDraftGenerated(params: { orgId: string; commitEventId: string; docDraftId: string; targetId?: string | null; docType: string; model: string; inputTokens: number; outputTokens: number; resolvedDirection: string | null; baselineUsed: 