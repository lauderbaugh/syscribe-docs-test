\# Directions API ## \`directionsPlugin\` \`\`\` async function directionsPlugin(fastify: FastifyInstance): Promise \`\`\` Registers the directions routes on your Fastify instance. Call this function during server setup to mount all directions-related endpoints. ### Parameters | Name | Type | Required | Description | |------|------|----------|-------------| | \`fastify\` | \`FastifyInstance\` | Yes | The Fastify server instance on which the directions routes are registered. | ### Returns \`Promise\` — Resolves when all routes have been successfully registered. ### Authentication Authentication requirements depend on the individual routes registered by this plugin. Refer to the specific endpoint documentation for details. ### Usage Example \`\`\`typescript import Fastify from 'fastify'; import { directionsPlugin } from './plugins/directions'; const fastify = Fastify({ logger: true }); fastify.register(directionsPlugin); fastify.listen({ port: 3000 }, (err) => { if (err) { fastify.log.error(err); process.exit(1); } }); \`\`\` ### Error Codes | Code | Description | |------|-------------| | \`500\` | The server failed to register one or more routes during startup. | --- ## Breaking Changes ### \`SettingsPage\` — Removed The exported \`SettingsPage\` function has been removed in this release. If you reference \`SettingsPage\` in your integration, you must update your code to remove or replace that dependency before upgrading.