### `ActivityItem`, `DashboardStats`, `DashboardResponse`

Internal interfaces describing the shape of the dashboard API response. `DashboardResponse` composes `DashboardStats` and an array of `ActivityItem`. All three were modified — likely field additions or type tightening.

* * *

### `fetchDashboard`

```ts
async function fetchDashboard(token: string): Promise<DashboardResponse | { error: string }>
```

ParameterTypeDescription`tokenstring`Bearer token for the API request

**Returns** `DashboardResponse` on success, or `{ error: string }` if the fetch fails or the API returns a non-2xx status. Callers must discriminate on `"error" in result` before using the response.

**Base URL**: `http://localhost:3001` (`API_BASE` constant). This is a development default and should not be used in production builds without environment override.

