\## Draft Management API Reference This reference documents the core functions, interfaces, and constants that power the documentation draft management system. Use these to understand how drafts are created, reviewed, approved, deployed, and rejected across document types and sections. --- ### Constants #### \`DOC\_TYPE\_LABEL\` A mapping constant that returns the human-readable label for a given documentation type. Use this when you need to display a doc type name in the UI. #### \`isSelected\` A boolean constant that indicates whether the current section or draft item is selected in the tree view. #### \`hasDraft\` A boolean constant that evaluates to \`true\` when the currently selected section has at least one associated draft. #### \`isDeployMode\` A boolean constant that determines whether the UI is operating in deploy mode (as opposed to approve/review mode). #### \`title\`, \`verb\`, \`verbIng\`, \`verbPast\` String constants that provide contextual action labels based on the current mode (\`isDeployMode\`). For example: - \`title\` — the modal or page title (e.g., "Approve" or "Deploy"). - \`verb\` — the base action verb (e.g., "approve" or "deploy"). - \`verbIng\` — the present-participle form (e.g., "approving" or "deploying"). - \`verbPast\` — the past-tense form (e.g., "approved" or "deployed"). #### \`draftIds\` An array of draft identifiers for all drafts associated with the current session or document type. #### \`perSectionDrafts\` A filtered or grouped collection of drafts organized by documentation section. #### \`notApplicableDrafts\` Drafts that have been marked as not applicable (N/A) for a given section. #### \`legacyDrafts\` Drafts generated under a previous schema or format that may not be compatible with the current approval or deploy workflow. #### \`hasOnlyLegacyDrafts\` A boolean constant that is \`true\` when all available drafts for a section or doc type are legacy drafts. #### \`approvableDrafts\` The full set of drafts eligible for approval across all doc types in the current context. #### \`approvableDraftsForDocType\` A filtered subset of \`approvableDrafts\` scoped to the currently selected documentation type. #### \`deployableDrafts\` The full set of drafts eligible for deployment across all doc types. #### \`deployableDraftsForDocType\` A filtered subset of \`deployableDrafts\` scoped to the currently selected documentation type. #### \`selectedIsNA\` A boolean constant that is \`true\` when the currently selected draft is marked as not applicable. #### \`selectedIsEditable\` A boolean constant that is \`true\` when the currently selected draft can be edited in the draft editor. #### \`\[regenerating, setRegenerating\]\` A React state pair. \`regenerating\` is a boolean indicating whether a regeneration request is in progress. Call \`setRegenerating(true)\` to signal the start of regeneration and \`setRegenerating(false)\` when complete. #### \`\[draftBusy, setDraftBusy\]\` A React state pair. \`draftBusy\` is a boolean that reflects whether the draft editor is actively processing (e.g., saving or loading). Use \`setDraftBusy\` to update this state. #### \`\[selectedId, setSelectedId\]\` A React state pair representing the currently selected node ID in the section tree. Call \`setSelectedId(id)\` to programmatically select a section. #### \`\[selectedDraft, setSelectedDraft\]\` A React state pair holding the currently selected draft object. Call \`setSelectedDraft(draft)\` to update the active draft. #### \`\[modalSections, setModalSections\]\` A React state pair representing the list of sections displayed in the confirmation modal. Set this before opening the modal. #### \`\[modalMode, setModalMode\]\` A React state pair that controls which action the confirmation modal is performing (\`'approve'\`, \`'reject'\`, or \`'deploy'\`). #### \`\[modalLoading, setModalLoading\]\` A React state pair indicating whether the modal is awaiting a server response. #### \`\[deploying, setDeploying\]\` A React state pair tracking whether a deploy operation is currently in progress. #### \`isHistoryTab\` A boolean constant that is \`true\` when the user is viewing the history tab rather than the active drafts tab. #### \`draftEditorRef\` A React ref attached to the draft editor component. Use this to call editor methods imperatively (e.g., triggering a save before approval). #### \`router\` The Next.js router instance used for programmatic navigation within the draft management interface. #### \`getFreshToken\` A constant holding a function that retrieves a fresh authentication token for authenticated API calls. Call this before making requests that require authorization. #### \`{ lastEvent }\` Destructured from a real-time event hook. \`lastEvent\` contains the most recent server-sent or WebSocket event related to draft status changes. #### \`handleDraftBusyChange\` A callback constant passed to the draft editor to notify the parent component when the editor's busy state changes. --- ### Interfaces #### \`TreeNode\` Represents a single node in the section navigation tree. | Property | Type | Description | |---|---|---| | \`id\` | \`string\` | Unique identifier for the section node. | | \`label\` | \`string\` | Display name of the section. | | \`children\` | \`TreeNode\[\]\` | Nested child nodes, if any. | | \`hasDraft\` | \`boolean\` | Whether this node has an associated draft. | | \`isNA\` | \`boolean\` | Whether this node's draft is marked not applicable. | #### \`SectionTreeProps\` Props accepted by the section tree component. | Property | Type | Description | |---|---|---| | \`nodes\` | \`TreeNode\[\]\` | The array of tree nodes to render. | | \`selectedId\` | \`string \\| null\` | The ID of the currently selected node. | | \`onSelect\` | \`(id: string) => void\` | Callback invoked when the user selects a node. | --- ### Functions #### \`statusBadgeVariant(status: string): string\` Returns the badge variant string (e.g., \`'success'\`, \`'warning'\`, \`'error'\`) for a given draft status value. Use this to apply consistent visual styling to status indicators. \*\*Parameters\*\* - \`status\` — The draft status string (e.g., \`'approved'\`, \`'pending'\`, \`'rejected'\`). \*\*Returns\*\* — A string representing the badge variant. --- #### \`statusLabel(status: string): string\` Returns the human-readable label for a given draft status. Use this when you need to display a status string in the UI. \*\*Parameters\*\* - \`status\` — The internal draft status string. \*\*Returns\*\* — A localized, human-readable status label. --- #### \`buildSectionTree(sections: Section\[\]): TreeNode\[\]\` Transforms a flat or nested array of sections into a \`TreeNode\[\]\` structure suitable for the section navigation tree. \*\*Parameters\*\* - \`sections\` — An array of section objects from the API. \*\*Returns\*\* — An array of \`TreeNode\` objects representing the section hierarchy. --- #### \`handleSelect(id: string): void\` Updates the selected section in the tree and loads the corresponding draft into the editor. Call this when a user clicks a node in the section tree. \*\*Parameters\*\* - \`id\` — The ID of the section node to select. --- #### \`approveDraft(draftId: string): Promise\` Sends an approval request for a single draft to the server. \*\*Parameters\*\* - \`draftId\` — The ID of the draft to approve. \*\*Returns\*\* — A promise that resolves when the approval is confirmed. --- #### \`rejectDraft(draftId: string): Promise\` Sends a rejection request for a single draft to the server. \*\*Parameters\*\* - \`draftId\` — The ID of the draft to reject. \*\*Returns\*\* — A promise that resolves when the rejection is confirmed. --- #### \`handleApproveSection(): Promise\` Approves all approvable drafts within the currently selected section. Opens a confirmation modal before proceeding. --- #### \`handleApproveDocType(): Promise\` Approves all approvable drafts for the currently selected documentation type. Opens a confirmation modal before proceeding. --- #### \`handleApproveAll(): Promise\` Approves all approvable drafts across all documentation types. Opens a confirmation modal before proceeding. --- #### \`handleConfirmModal(): Promise\` Executes the action currently set in \`modalMode\` (\`'approve'\`, \`'reject'\`, or \`'deploy'\`) for the sections stored in \`modalSections\`. Called when the user confirms the modal dialog. --- #### \`deployDraft(draftId: string): Promise\` Sends a deploy request for a single draft to the server. \*\*Parameters\*\* - \`draftId\` — The ID of the draft to deploy. \*\*Returns\*\* — A promise that resolves when the deployment is confirmed. --- #### \`handleDeploySection(): Promise\` Deploys all deployable drafts within the currently selected section. Opens a confirmation modal before proceeding. --- #### \`handleDeployDocType(): Promise\` Deploys all deployable drafts for the currently selected documentation type. Opens a confirmation modal before proceeding. --- #### \`handleDeployAll(): Promise\` Deploys all deployable drafts across all documentation types. Opens a confirmation modal before proceeding. --- #### \`handleRejectSection(): Promise\` Rejects all drafts within the currently selected section. Opens a confirmation modal before proceeding. --- #### \`handleRejectAll(): Promise\` Rejects all drafts across all documentation types. Opens a confirmation modal before proceeding. --- #### \`handleRegenerate(): Promise\` Triggers regeneration of the currently selected draft. Sets \`regenerating\` to \`true\` during the operation and resets it on completion or error.