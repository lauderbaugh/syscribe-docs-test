## Related Symbols

-   `DocIntegration` — interface that `NotionIntegration` implements; defines the contract for `push`, `fetchContent`, `fetchContentHash`
    
-   `ApprovedDraft` — input to `NotionIntegration.push`
    
-   `DeployResult` — output of `NotionIntegration.push`
    
-   `IntegrationNode` — represents an existing deployment node; may be `null` on first deploy
    
-   `DocConfig`, `DocBaseline`, `OnboardingStatus` — shared types used across settings and review surfaces
    
-   `useOrgToken` — hook that returns a `getFreshToken` function; used in all client components that call authenticated API routes
    
-   `DOC_TYPE_LABEL` — exported from the shared types module; also duplicated locally in dashboard/drafts list components (local copies are `non-exported`)
    
-   `BullMQ Worker` — `deployDraftWorker` is a `Worker<DeployDraftJobData>`; producers must use the matching queue name