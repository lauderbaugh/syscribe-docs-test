\# Draft Editor API Reference This reference covers the public types and interfaces introduced or modified in commit \`e788342712c37c495694884f775d07926cd9974b\`. Only exported symbols are documented here. --- ## \`DraftEditorBusyState\` \*\*Type\*\* | \*\*Added\*\* \`\`\`ts type DraftEditorBusyState = { saving: boolean; approving: boolean; rejecting: boolean; deploying?: boolean; }; \`\`\` Represents the busy/loading state of a \`DraftEditor\` component. Each field corresponds to an in-flight async action within the editor. You can read this state from a parent component via the \`onBusyChange\` callback on \`DraftEditorProps\`. ### Fields | Field | Type | Description | |---|---|---| | \`saving\` | \`boolean\` | \`true\` while a save operation is in progress. | | \`approving\` | \`boolean\` | \`true\` while an approve operation is in progress. | | \`rejecting\` | \`boolean\` | \`true\` while a reject operation is in progress. | | \`deploying\` | \`boolean\` (optional) | \`true\` while a deploy operation is in progress. | ### Example \`\`\`ts import type { DraftEditorBusyState } from "@/components/draft-editor"; function handleBusyChange(state: DraftEditorBusyState) { if (state.saving) { console.log("Draft is currently saving…"); } } \`\`\` --- ## \`DraftEditorHandle\` \*\*Type\*\* | \*\*Added\*\* \`\`\`ts type DraftEditorHandle = { // Imperative handle exposed via React.forwardRef / useImperativeHandle }; \`\`\` An imperative ref handle you attach to a \`DraftEditor\` component. Use it to call editor actions programmatically from a parent component. Obtain a reference to it with \`React.useRef(null)\` and pass it as the \`ref\` prop to \`DraftEditor\`. ### Example \`\`\`ts import React from "react"; import { DraftEditor } from "@/components/draft-editor"; import type { DraftEditorHandle } from "@/components/draft-editor"; function ParentComponent() { const editorRef = React.useRef(null); return ( ); } \`\`\` --- ## \`DraftEditorProps\` \*\*Interface\*\* | \*\*Modified\*\* Props accepted by the \`DraftEditor\` component. This interface was updated in this release. ### Properties > \*\*Note:\*\* The complete field list for \`DraftEditorProps\` is not fully enumerated in the available symbol data. The following properties are confirmed present based on internal usage within this change. | Property | Type | Required | Description | |---|---|---|---| | \`orgId\` | \`string\` | Yes | The organization ID used to obtain a fresh auth token. | | \`initialContent\` | \`string\` | Yes | The initial Markdown content to load into the editor. | | \`isEditable\` | \`boolean\` | Yes | Controls whether the editor is in an editable state. | | \`actionBarPlacement\` | \`"fixedBottom" \\| string\` | Yes | Determines where the editor action bar renders. Pass \`"fixedBottom"\` to pin it to the bottom of the viewport. | | \`onBusyChange\` | \`(state: DraftEditorBusyState) => void\` | No | Callback invoked whenever the editor's busy state changes. Use this to reflect in-progress actions in the parent UI. | | \`ref\` | \`React.Ref\` | No | Attach a \`DraftEditorHandle\` ref to call imperative editor actions from outside the component. | ### Example \`\`\`tsx import React from "react"; import { DraftEditor } from "@/components/draft-editor"; import type { DraftEditorHandle, DraftEditorBusyState } from "@/components/draft-editor"; function ReviewPage() { const editorRef = React.useRef(null); function handleBusyChange(state: DraftEditorBusyState) { console.log("Editor busy state:", state); } return ( ); } \`\`\` --- ## \`DraftDetail\` \*\*Interface\*\* | \*\*Modified\*\* Describes a single documentation draft associated with a pull request. This interface was updated in this release. ### Properties > The complete field list is not fully enumerated in the available symbol data. The following fields are confirmed present based on internal usage within this change. | Property | Type | Description | |---|---|---| | \`id\` | \`string\` | Unique identifier for the draft. | | \`status\` | \`DraftStatus\` | Current lifecycle status of the draft. | | \`docType\` | \`"INTERNAL" \\| "USER\_FACING" \\| "API"\` | The category of documentation this draft represents. | | \`baselineContent\` | \`string \\| null \\| undefined\` | The previously published content against which this draft is compared. | ### \`DraftStatus\` values | Value | Description | |---|---| | \`"DRAFT"\` | The draft has been created and is being edited. | | \`"IN\_REVIEW"\` | The draft has been submitted for review. | | \`"APPROVED"\` | The draft has been approved. | | \`"DEPLOYED"\` | The draft has been published to its deployment target. | | \`"REJECTED"\` | The draft was rejected during review. | | \`"FAILED"\` | Deployment or processing failed. | | \`"NOT\_APPLICABLE"\` | The draft was determined not to require documentation changes. | --- ## \`PRReviewData\` \*\*Interface\*\* | \*\*Modified\*\* The top-level data structure returned when you fetch a pull request review. This interface was updated in this release. ### Properties > The complete field list is not fully enumerated in the available symbol data. The following fields are confirmed present based on internal usage within this change. | Property | Type | Description | |---|---|---| | \`drafts\` | \`DraftDetail\[\]\` | All documentation drafts associated with the pull request. | ### Example shape \`\`\`json { "drafts": \[ { "id": "draft\_xyz789", "status": "IN\_REVIEW", "docType": "USER\_FACING", "baselineContent": "## Previous content" } \] } \`\`\` --- ## \`PRReviewPage\` \*\*Function\*\* | \*\*Added\*\* | \*\*Exported\*\* \`\`\`ts async function PRReviewPage({ params, }: { params: Promise<{ commitEventId: string }>; }): Promise \`\`\` A Next.js async server component that renders the full pull request documentation review UI for a given commit event. It authenticates the current user, fetches the PR review data for the specified commit, and renders the review editor. ### Authentication You must be authenticated as an organization member. The component resolves credentials automatically via the server-side \`auth()\` helper using your active session. No additional credential setup is required when navigating to the page. ### Parameters | Parameter | Type | Required | Description | |---|---|---|---| | \`params\` | \`Promise<{ commitEventId: string }>\` | Yes | Next.js route params. \`commitEventId\` identifies the specific commit event whose documentation drafts you want to review. | ### Behavior - Authenticates the current user and obtains an organization-scoped token. - Calls \`fetchPRReview\` with the resolved token and \`commitEventId\`. - Renders the \`PRReviewEditor\` component populated with the returned \`PRReviewData\`. - If the fetch returns an error object, you receive an error state rather than the editor. ### Example You access this page by navigating to its route. No direct invocation is required. \`\`\` /pr-review/\[commitEventId\] \`\`\` For example: \`\`\` /pr-review/evt\_a1b2c3d4 \`\`\` ---