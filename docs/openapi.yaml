\# API Reference — Commit \`ed4d434\` This release introduces the \*\*\`AgentInteraction\`\*\* data model and its full Prisma type surface, adds the \`AgentInteractionPanel\` UI component, connects \`AgentInteraction\` records to \`DocDraft\`, and updates the \`AnthropicAdapter\` generation layer. --- ## New Model: \`AgentInteraction\` ### \`type AgentInteraction\` \`\`\`ts type AgentInteraction = Prisma.AgentInteractionModel \`\`\` Represents a single agent interaction session tied to a \`DocDraft\`. Each record captures the instruction sent to the agent, the resulting draft content, token usage, and whether the revision was reverted. --- ### \`AgentInteractionModel\` \`\`\`ts type AgentInteractionModel = runtime.Types.Result.DefaultSelection \`\`\` The resolved default-selection shape returned by Prisma queries on \`agentInteraction\`. Fields include: | Field | Type | Description | |---|---|---| | \`id\` | \`string\` | Unique identifier | | \`orgId\` | \`string\` | Owning organisation | | \`draftId\` | \`string\` | Associated \`DocDraft\` | | \`userId\` | \`string\` | User who triggered the interaction | | \`instruction\` | \`string\` | Prompt / instruction sent to the agent | | \`responseDraftContent\` | \`string\` | Markdown content returned by the agent | | \`reverted\` | \`boolean\` | Whether the revision was subsequently reverted | | \`resolvedDirection\` | \`string \\| null\` | Direction rule applied, if any | | \`inputTokens\` | \`number \\| null\` | LLM input token count | | \`outputTokens\` | \`number \\| null\` | LLM output token count | | \`createdAt\` | \`DateTime\` | Record creation timestamp | --- ### \`AgentInteractionScalarFieldEnum\` \`\`\`ts export const AgentInteractionScalarFieldEnum = { ... } type AgentInteractionScalarFieldEnum = (typeof AgentInteractionScalarFieldEnum)\[keyof typeof AgentInteractionScalarFieldEnum\] \`\`\` Enum of all scalar field names on \`AgentInteraction\`. You can use these values in \`orderBy\`, \`select\`, and \`groupBy\` clauses. --- ### Query Types #### \`AgentInteractionWhereInput\` Filter input for querying \`AgentInteraction\` records. Supports \`AND\`, \`OR\`, and \`NOT\` combinators plus per-field filters. #### \`AgentInteractionWhereUniqueInput\` \`\`\`ts type AgentInteractionWhereUniqueInput = Prisma.AtLeast<{ id: string; ... }> \`\`\` Uniquely identifies a single \`AgentInteraction\` record. Pass \`{ id: "..." }\`. #### \`AgentInteractionOrderByWithRelationInput\` Sorting input including relation ordering for associated \`DocDraft\`. #### \`AgentInteractionOrderByWithAggregationInput\` Sorting input for use with \`groupBy\` queries. #### \`AgentInteractionScalarWhereWithAggregatesInput\` Scalar-only filter input for aggregation queries. --- ### Mutation Types #### \`AgentInteractionCreateInput\` \`\`\`ts type AgentInteractionCreateInput = { orgId: string userId: string instruction: string responseDraftContent: string reverted?: boolean resolvedDirection?: string | null inputTokens?: number | null outputTokens?: number | null draft: DocDraftCreateNestedOneWithoutAgentInteractionsInput } \`\`\` Use this type when creating a standalone \`AgentInteraction\` record via \`prisma.agentInteraction.create()\`. #### \`AgentInteractionUncheckedCreateInput\` Like \`AgentInteractionCreateInput\` but accepts raw foreign-key scalars (\`draftId\`) instead of relation objects. #### \`AgentInteractionUpdateInput\` Partial update shape for all writable fields. Wrap scalar numeric fields in \`{ set: number }\` or \`{ increment: number }\` operation objects. #### \`AgentInteractionCreateManyInput\` Input for bulk creation via \`createMany\`. Does not accept nested relation writes. #### \`AgentInteractionUpdateManyMutationInput\` Partial update shape for bulk \`updateMany\` operations. --- ### Aggregation Types | Type | Description | |---|---| | \`AggregateAgentInteraction\` | Root aggregate result containing \`\_count\`, \`\_avg\`, \`\_sum\`, \`\_min\`, \`\_max\` | | \`AgentInteractionAvgAggregateOutputType\` | Average of numeric fields (\`inputTokens\`, \`outputTokens\`) | | \`AgentInteractionSumAggregateOutputType\` | Sum of numeric fields | | \`AgentInteractionMinAggregateOutputType\` | Minimum values | | \`AgentInteractionMaxAggregateOutputType\` | Maximum values | | \`AgentInteractionCountAggregateOutputType\` | Per-field and \`\_all\` counts | #### \`AgentInteractionAggregateArgs\` \`\`\`ts type AgentInteractionAggregateArgs = { where?: AgentInteractionWhereInput orderBy?: AgentInteractionOrderByWithRelationInput | AgentInteractionOrderByWithRelationInput\[\] cursor?: AgentInteractionWhereUniqueInput take?: number skip?: number \_count?: AgentInteractionCountAggregateInputType | true \_avg?: AgentInteractionAvgAggregateInputType \_sum?: AgentInteractionSumAggregateInputType \_min?: AgentInteractionMinAggregateInputType \_max?: AgentInteractionMaxAggregateInputType } \`\`\` #### \`AgentInteractionGroupByArgs\` \`\`\`ts type AgentInteractionGroupByArgs = { where?: AgentInteractionWhereInput orderBy?: AgentInteractionOrderByWithAggregationInput | ...\[\] by: AgentInteractionScalarFieldEnum\[\] | AgentInteractionScalarFieldEnum having?: AgentInteractionScalarWhereWithAggregatesInput take?: number skip?: number } \`\`\` --- ### \`AgentInteractionDelegate\` \`\`\`ts interface AgentInteractionDelegate \`\`\` The Prisma table delegate exposed at \`prisma.agentInteraction\`. You call all CRUD and aggregation methods through this interface. \*\*TypeScript example:\*\* \`\`\`ts import { PrismaClient } from '@your-package/db' const prisma = new PrismaClient({ adapter: new PrismaPg({ connectionString: process.env.DATABASE\_URL }), }) // Create a new interaction const interaction = await prisma.agentInteraction.create({ data: { orgId: 'org\_abc', userId: 'user\_xyz', instruction: 'Rewrite the introduction to be more concise.', responseDraftContent: '# Overview\\n\\nThis API lets you...', reverted: false, inputTokens: 512, outputTokens: 256, draft: { connect: { id: 'draft\_001' } }, }, }) // Query interactions for a draft const interactions = await prisma.agentInteraction.findMany({ where: { draftId: 'draft\_001' }, orderBy: { createdAt: 'desc' }, }) // Aggregate token usage const totals = await prisma.agentInteraction.aggregate({ where: { orgId: 'org\_abc' }, \_sum: { inputTokens: true, outputTokens: true }, }) \`\`\` --- ### Operation Arg Types | Type | Description | |---|---| | \`AgentInteractionFindUniqueArgs\` | Args for \`findUnique\` | | \`AgentInteractionFindUniqueOrThrowArgs\` | Args for \`findUniqueOrThrow\` | | \`AgentInteractionFindFirstArgs\` | Args for \`findFirst\` | | \`AgentInteractionFindFirstOrThrowArgs\` | Args for \`findFirstOrThrow\` | | \`AgentInteractionFindManyArgs\` | Args for \`findMany\` | | \`AgentInteractionCreateArgs\` | Args for \`create\` | | \`AgentInteractionCreateManyArgs\` | Args for \`createMany\` | | \`AgentInteractionCreateManyAndReturnArgs\` | Args for \`createManyAndReturn\` | | \`AgentInteractionUpdateArgs\` | Args for \`update\` | | \`AgentInteractionUpdateManyArgs\` | Args for \`updateMany\` | | \`AgentInteractionUpdateManyAndReturnArgs\` | Args for \`updateManyAndReturn\` | | \`AgentInteractionUpsertArgs\` | Args for \`upsert\` | | \`AgentInteractionDeleteArgs\` | Args for \`delete\` | | \`AgentInteractionDeleteManyArgs\` | Args for \`deleteMany\` | | \`AgentInteractionDefaultArgs\` | Default args shape (no action) | | \`AgentInteractionCountArgs\` | Args for \`count\` | --- ### \`Prisma\_\_AgentInteractionClient\` \`\`\`ts interface Prisma\_\_AgentInteractionClient extends Prisma.PrismaPromise \`\`\` Promise-like fluent client returned by delegate methods such as \`findUnique\` and \`create\`. Call \`.draft()\` to traverse the relation to \`DocDraft\`. --- ### \`AgentInteractionFieldRefs\` \`\`\`ts interface AgentInteractionFieldRefs \`\`\` Typed field references for use in Prisma's field-reference API (e.g. \`orderBy: { inputTokens: 'desc' }\`). --- ### Relation Input Types #### \`AgentInteractionCreateNestedManyWithoutDraftInput\` \`\`\`ts type AgentInteractionCreateNestedManyWithoutDraftInput = { create?: AgentInteractionCreateWithoutDraftInput | AgentInteractionCreateWithoutDraftInput\[\] connectOrCreate?: AgentInteractionCreateOrConnectWithoutDraftInput | ...\[\] createMany?: AgentInteractionCreateManyDraftInputEnvelope connect?: AgentInteractionWhereUniqueInput | AgentInteractionWhereUniqueInput\[\] } \`\`\` Use this type inside \`DocDraftCreateInput\` to create \`AgentInteraction\` records together with a \`DocDraft\`. #### \`AgentInteractionUpdateManyWithoutDraftNestedInput\` Use this type inside \`DocDraftUpdateInput\` to add, update, delete, or disconnect \`AgentInteraction\` records when updating a \`DocDraft\`. --- ## Updated Model: \`DocDraft\` \`DocDraft\` now carries an \`agentInteractions\` relation to \`AgentInteraction\`. The following types are new or updated: ### \`DocDraftCountOutputType\` \`\`\`ts type DocDraftCountOutputType = { revisions: number deployments: number agentInteractions: number // ← new } \`\`\` ### \`DocDraft$agentInteractionsArgs\` \`\`\`ts type DocDraft$agentInteractionsArgs = { select?: AgentInteractionSelect | null include?: AgentInteractionInclude | null where?: AgentInteractionWhereInput orderBy?: AgentInteractionOrderByWithRelationInput | ...\[\] cursor?: AgentInteractionWhereUniqueInput take?: number skip?: number distinct?: AgentInteractionScalarFieldEnum | AgentInteractionScalarFieldEnum\[\] } \`\`\` Controls how \`agentInteractions\` are fetched when you include them in a \`DocDraft\` query. ### New relation inputs on \`DocDraft\` | Type | Purpose | |---|---| | \`DocDraftCreateNestedOneWithoutAgentInteractionsInput\` | Nest a \`DocDraft\` connect/create inside an \`AgentInteraction\` create | | \`DocDraftUpdateOneRequiredWithoutAgentInteractionsNestedInput\` | Update the parent \`DocDraft\` from an \`AgentInteraction\` update | | \`DocDraftCreateWithoutAgentInteractionsInput\` | Create a \`DocDraft\` without touching its interactions | | \`DocDraftUncheckedCreateWithoutAgentInteractionsInput\` | Unchecked variant | | \`DocDraftCreateOrConnectWithoutAgentInteractionsInput\` | Connect-or-create a \`DocDraft\` | | \`DocDraftUpsertWithoutAgentInteractionsInput\` | Upsert a \`DocDraft\` | | \`DocDraftUpdateToOneWithWhereWithoutAgentInteractionsInput\` | Conditional update | | \`DocDraftUpdateWithoutAgentInteractionsInput\` | Update a \`DocDraft\` without touching interactions | | \`DocDraftUncheckedUpdateWithoutAgentInteractionsInput\` | Unchecked variant | | \`DocDraftCountOutputTypeCountAgentInteractionsArgs\` | Count args for \`agentInteractions\` on \`DocDraftCountOutputType\` | \*\*TypeScript example — include interactions on a draft:\*\* \`\`\`ts const draft = await prisma.docDraft.findUnique({ where: { id: 'draft\_001' }, include: { agentInteractions: { orderBy: { createdAt: 'asc' }, }, }, }) \`\`\` --- ## New Filter Types ### \`IntNullableFilter\` \`\`\`ts type IntNullableFilter<$PrismaModel = never> = { equals?: number | null in?: number\[\] | null notIn?: number\[\] | null lt?: number lte?: number gt?: number gte?: number not?: NestedIntNullableFilter<$PrismaModel> | number | null } \`\`\` Filters nullable integer fields (e.g. \`inputTokens\`, \`outputTokens\` on \`AgentInteraction\`). ### \`IntNullableWithAggregatesFilter\` Extends \`IntNullableFilter\` with \`\_count\`, \`\_avg\`, \`\_sum\`, \`\_min\`, \`\_max\` aggregate sub-filters. ### \`NestedIntNullableWithAggregatesFilter\` \`\`\`ts type NestedIntNullableWithAggregatesFilter<$PrismaModel = never> = { equals?: number | null in?: number\[\] | null notIn?: number\[\] | null lt?: number lte?: number gt?: number gte?: number not?: NestedIntNullableWithAggregatesFilter<$PrismaModel> | number | null \_count?: NestedIntNullableFilter<$PrismaModel> \_avg?: NestedFloatNullableFilter<$PrismaModel> \_sum?: NestedIntNullableFilter<$PrismaModel> \_min?: NestedIntNullableFilter<$PrismaModel> \_max?: NestedIntNullableFilter<$PrismaModel> } \`\`\` ### \`NestedFloatNullableFilter\` \`\`\`ts type NestedFloatNullableFilter<$PrismaModel = never> = { equals?: number | null in?: number\[\] | null notIn?: number\[\] | null lt?: number lte?: number gt?: number gte?: number not?: NestedFloatNullableFilter<$PrismaModel> | number | null } \`\`\` ### \`NullableIntFieldUpdateOperationsInput\` \`\`\`ts type NullableIntFieldUpdateOperationsInput = { set?: number | null increment?: number decrement?: number multiply?: number divide?: number } \`\`\` Use this type to update nullable integer fields in an \`AgentInteraction\` update operation. --- ## New UI Component: \`AgentInteractionPanel\` ### \`function AgentInteractionPanel\` \`\`\`ts function AgentInteractionPanel({ draftId, draftStatus, orgId, onRevision, }: AgentInteractionPanelProps): JSX.Element \`\`\` Renders an interactive panel that lets users send revision instructions to the documentation agent and apply or revert the resulting content. You embed this component inside the draft editor view. #### \`AgentInteractionPanelProps\` | Prop | Type | Required | Description | |---|---|---|---| | \`draftId\` | \`string\` | Yes | ID of the \`DocDraft