\# Pipeline Events API Reference This document covers the public symbols introduced in commit \`5fa47c4b1b20541e2ba1c7063140b29835dc1c67\`, including the server-side pipeline event system, the Server-Sent Events (SSE) endpoint, and the client-side realtime hook. --- ## Types ### \`PipelineEventType\` A union type representing the set of event categories the pipeline can emit. \`\`\`ts type PipelineEventType = | 'draft.created' | 'draft.updated' | 'deployment.updated' | 'commit.processed'; \`\`\` --- ### \`PipelineEventPayload\` A discriminated union of all valid pipeline event payload shapes. The concrete type is determined by the accompanying \`type\` field on a \`PipelineEvent\`. \`\`\`ts type PipelineEventPayload = | DraftCreatedPayload | DraftUpdatedPayload | DeploymentUpdatedPayload | CommitProcessedPayload; \`\`\` --- ### \`PipelineEvent\` A fully-typed event object passed to emitters and listeners. \`\`\`ts interface PipelineEvent { type: PipelineEventType; orgId: string; payload: PipelineEventPayload; } \`\`\` | Field | Type | Required | Description | |-----------|------------------------|----------|----------------------------------------------------| | \`type\` | \`PipelineEventType\` | Yes | The category of the event. | | \`orgId\` | \`string\` | Yes | The organisation this event is scoped to. | | \`payload\` | \`PipelineEventPayload\` | Yes | Event-specific data matching the declared \`type\`. | --- ### \`DraftCreatedPayload\` Payload carried by a \`draft.created\` event. \`\`\`ts interface DraftCreatedPayload { draftId: string; commitEventId: string; } \`\`\` --- ### \`DraftUpdatedPayload\` Payload carried by a \`draft.updated\` event. \`\`\`ts interface DraftUpdatedPayload { draftId: string; status: string; } \`\`\` --- ### \`DeploymentUpdatedPayload\` Payload carried by a \`deployment.updated\` event. \`\`\`ts interface DeploymentUpdatedPayload { deploymentId: string; status: string; } \`\`\` --- ### \`CommitProcessedPayload\` Payload carried by a \`commit.processed\` event. \`\`\`ts interface CommitProcessedPayload { commitEventId: string; status: string; } \`\`\` --- ### \`ActivityItem\` Represents a single entry in the activity feed returned by the dashboard. \`\`\`ts interface ActivityItem { // fields inferred from usage; see DashboardResponse } \`\`\` > \*\*Note:\*\* The full field set of \`ActivityItem\` is determined by the dashboard response shape. Refer to the dashboard endpoint documentation for the complete schema. --- ## Server-Side Event Utilities ### \`pipelineEmitter\` \`\`\`ts export const pipelineEmitter: PipelineEventEmitter; \`\`\` The singleton event emitter instance for all pipeline events. You interact with it via \`emitPipelineEvent\`, \`onOrgEvent\`, and \`offOrgEvent\` rather than directly. --- ### \`emitPipelineEvent(event)\` Emits a pipeline event scoped to an organisation. All listeners registered for the event's \`orgId\` receive the event. \*\*Signature\*\* \`\`\`ts function emitPipelineEvent(event: PipelineEvent): void \`\`\` \*\*Parameters\*\* | Parameter | Type | Required | Description | |-----------|-----------------|----------|--------------------------| | \`event\` | \`PipelineEvent\` | Yes | The event object to emit.| \*\*Example\*\* \`\`\`ts import { emitPipelineEvent } from './pipeline-events'; emitPipelineEvent({ type: 'draft.created', orgId: 'org\_abc123', payload: { draftId: 'draft\_xyz', commitEventId: 'ce\_001', }, }); \`\`\` --- ### \`onOrgEvent(orgId, listener)\` Subscribes to all pipeline events for a specific organisation. You receive every \`PipelineEvent\` emitted for that \`orgId\`. \*\*Signature\*\* \`\`\`ts function onOrgEvent( orgId: string, listener: (event: PipelineEvent) => void, ): void \`\`\` \*\*Parameters\*\* | Parameter | Type | Required | Description | |------------|------------------------------------|----------|------------------------------------------------------| | \`orgId\` | \`string\` | Yes | The organisation ID to subscribe to. | | \`listener\` | \`(event: PipelineEvent) => void\` | Yes | Callback invoked with each event for this org. | \*\*Example\*\* \`\`\`ts import { onOrgEvent } from './pipeline-events'; function handleEvent(event) { console.log('Received event:', event.type, event.payload); } onOrgEvent('org\_abc123', handleEvent); \`\`\` --- ### \`offOrgEvent(orgId, listener)\` Unsubscribes a previously registered listener from pipeline events for a specific organisation. You must pass the same function reference used in \`onOrgEvent\`. \*\*Signature\*\* \`\`\`ts function offOrgEvent( orgId: string, listener: (event: PipelineEvent) => void, ): void \`\`\` \*\*Parameters\*\* | Parameter | Type | Required | Description | |------------|------------------------------------|----------|----------------------------------------------------------------| | \`orgId\` | \`string\` | Yes | The organisation ID to unsubscribe from. | | \`listener\` | \`(event: PipelineEvent) => void\` | Yes | The exact callback reference passed to \`onOrgEvent\`. | \*\*Example\*\* \`\`\`ts import { onOrgEvent, offOrgEvent } from './pipeline-events'; function handleEvent(event) { console.log(event); } onOrgEvent('org\_abc123', handleEvent); // Later, clean up: offOrgEvent('org\_abc123', handleEvent); \`\`\` --- ## HTTP Endpoints ### \`GET /events/\` Streams real-time pipeline events to connected clients over Server-Sent Events (SSE). The server sends a heartbeat every 30 seconds to keep the connection alive. \*\*Authentication\*\* You must include a valid organisation-scoped bearer token in the \`Authorization\` header. The \`/events/\` path prefix is exempt from standard auth middleware, but the \`eventsPlugin\` validates the token internally. \*\*Request\*\* \`\`\` GET /events/ Authorization: Bearer \`\`\` \*\*Response\*\* The response uses \`Content-Type: text/event-stream\`. Each SSE message carries a JSON-serialised \`RealtimeEvent\` in its \`data\` field. \`\`\` data: {"type":"draft.created","orgId":"org\_abc123","payload":{"draftId":"draft\_xyz","commitEventId":"ce\_001"}} data: {"type":"commit.processed","orgId":"org\_abc123","payload":{"commitEventId":"ce\_001","status":"COMPLETE"}} \`\`\` Heartbeat frames (sent every 30 s): \`\`\` : heartbeat \`\`\` \*\*Error codes\*\* | Status | Description | |--------|----------------------------------------------------------| | \`401\` | Missing or invalid bearer token. | | \`403\` | Token does not grant access to the requested org scope. | \*\*curl example\*\* \`\`\`bash curl -N \\ -H "Authorization: Bearer " \\ http://localhost:3001/events/ \`\`\` --- ## Client-Side Hook ### \`useRealtimeEvents(getToken)\` A React hook that opens and maintains an SSE connection to \`/events/\`, automatically reconnects with exponential back-off on failure, and exposes the most recently received event. \*\*Signature\*\* \`\`\`ts function useRealtimeEvents( getToken: () => Promise, ): { lastEvent: RealtimeEvent | null } \`\`\` \*\*Parameters\*\* | Parameter | Type | Required | Description | |------------|-----------------------------------|----------|-----------------------------------------------------------------------------------| | \`getToken\` | \`() => Promise\` | Yes | Async function that resolves to a valid org-scoped token, or \`null\` if unavailable.| \*\*Returns\*\* | Field | Type | Description | |-------------|---------------------------|-----------------------------------------------------------------| | \`lastEvent\` | \`RealtimeEvent \\| null\` | The most recently received event, or \`null\` before the first event arrives. | The hook reconnects automatically. Back-off starts at 1 000 ms and caps at 30 000 ms. \*\*Example\*\* \`\`\`tsx import { useRealtimeEvents } from '@/lib/use-realtime-events'; import { useOrgToken } from '@/lib/use-org-token'; function ActivityFeed({ orgId }: { orgId: string }) { const getToken = useOrgToken(orgId); const { lastEvent } = useRealtimeEvents(getToken); React.useEffect(() => { if (!lastEvent) return; console.log('New realtime event:', lastEvent.type, lastEvent.payload); }, \[lastEvent\]); return

