\# Notion Integration API Reference ## \`NotionIntegration\` Class \`class NotionIntegration implements DocIntegration\` \`NotionIntegration\` provides a Notion-backed implementation of the \`DocIntegration\` interface. Use it to push approved documentation drafts to a Notion page, fetch current page content, and retrieve content hashes for change detection. --- ### \`push(draft, node, deploymentConfig)\` \`\`\`ts async push( draft: ApprovedDraft, node: IntegrationNode | null, deploymentConfig: Record, ): Promise \`\`\` Publishes an approved draft to a Notion page. When the deployment configuration identifies a specific H2 section heading, only the content beneath that heading is replaced — the heading block itself is preserved. When no section heading is specified, the entire page content is replaced. #### Parameters | Name | Type | Required | Description | |---|---|---|---| | \`draft\` | \`ApprovedDraft\` | Yes | The approved documentation draft to publish. | | \`node\` | \`IntegrationNode \\| null\` | Yes | The integration node context, or \`null\` if not applicable. | | \`deploymentConfig\` | \`Record\` | Yes | Deployment-specific configuration values, including the target Notion page ID and optional section heading. | #### Returns \`Promise\` — Resolves with a \`DeployResult\` describing the outcome of the deployment. #### Example \`\`\`ts const result = await notionIntegration.push( approvedDraft, integrationNode, { pageId: "abc123def456", sectionHeading: "API Reference", } ); \`\`\` --- ### \`fetchContentHash(deploymentConfig)\` \`\`\`ts async fetchContentHash(deploymentConfig: Record): Promise \`\`\` Fetches a hash of the current content on the target Notion page. Use this to detect whether the remote content has changed since the last deployment without fetching the full page body. #### Parameters | Name | Type | Required | Description | |---|---|---|---| | \`deploymentConfig\` | \`Record\` | Yes | Deployment-specific configuration values, including the target Notion page ID. | #### Returns \`Promise\` — Resolves with a content hash string, or \`null\` if the page has no content or cannot be reached. #### Example \`\`\`ts const hash = await notionIntegration.fetchContentHash({ pageId: "abc123def456", }); if (hash !== previousHash) { console.log("Remote content has changed."); } \`\`\` --- ### \`fetchContent(deploymentConfig)\` \`\`\`ts async fetchContent(deploymentConfig: Record): Promise \`\`\` Fetches the current content of the target Notion page as a Markdown string. Block content is converted from Notion's block format using ATX-style headings, fenced code blocks, and dash-prefixed bullet lists. #### Parameters | Name | Type | Required | Description | |---|---|---|---| | \`deploymentConfig\` | \`Record\` | Yes | Deployment-specific configuration values, including the target Notion page ID. | #### Returns \`Promise\` — Resolves with the page content as a Markdown string, or \`null\` if the page is empty or unavailable. #### Example \`\`\`ts const markdown = await notionIntegration.fetchContent({ pageId: "abc123def456", }); console.log(markdown); // ## API Reference // This section describes available endpoints... \`\`\` --- ## \`DeployDraftJobData\` Interface \`\`\`ts interface DeployDraftJobData \`\`\` Defines the shape of data passed to the \`deployDraftWorker\` job queue. You must provide a value that satisfies this interface when enqueuing a draft deployment job. > \*\*Note:\*\* Individual fields on \`DeployDraftJobData\` were modified in this release. Consult your internal job queue documentation or TypeScript types for the current field definitions. --- ## \`deployDraftWorker\` \`\`\`ts export const deployDraftWorker = new Worker(...) \`\`\` A BullMQ \`Worker\` instance that processes draft deployment jobs from the Redis-backed queue. It consumes \`DeployDraftJobData\` job payloads and coordinates pushing approved drafts to their configured integration targets (including Notion). The worker connects to Redis using the \`REDIS\_URL\` environment variable. You do not instantiate this directly — it starts automatically when the worker process launches. --- ## Behavior Notes ### Surgical Section Updates When you supply a \`sectionHeading\` in \`deploymentConfig\`, \`push()\` performs a targeted update: 1. You identify the H2 heading by its plain text (matched case-insensitively). 2. The integration deletes all blocks between that H2 and the next H2 (or end of page). 3. Your new content blocks are appended directly after the H2. 4. The H2 heading block itself is never deleted. This allows you to manage individual sections of a Notion page independently without overwriting unrelated content. ### Pagination Page block fetching handles pagination automatically, up to 500 blocks per page. If your page exceeds 500 blocks, only the first 500 are considered during section detection and content replacement. ### Markdown Conversion When you call \`fetchContent()\`, Notion blocks are converted to Markdown with the following settings: | Setting | Value | |---|---| | Heading style | ATX (\`#\`, \`##\`, \`###\`) | | Code block style | Fenced (\` \`\`\` \`) | | Bullet list marker | \`-\` |