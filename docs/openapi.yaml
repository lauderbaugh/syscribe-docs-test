\# API Reference — PR #2 Changes (\`709d4815\`) ## Overview This release removes the content-fetcher abstraction layer (\`GitbookFetcher\`, \`GitHubPagesFetcher\`, \`NotionFetcher\`, and related helpers) along with their shared \`ContentFetcher\`/\`SyncResult\` interfaces. The \`reposPlugin\` route handler has been updated accordingly. All removed symbols were internal implementation details or previously exported classes that are no longer part of the public API. --- ## \`reposPlugin\` ### Signature \`\`\`ts async function reposPlugin(fastify: FastifyInstance): Promise \`\`\` ### Description Registers repository-related routes on the provided Fastify instance. This plugin must be registered via \`fastify.register()\`. Its internal routing logic has been updated as part of this release. ### Parameters | Name | Type | Required | Description | |------|------|----------|-------------| | \`fastify\` | \`FastifyInstance\` | Yes | The Fastify server instance to register routes on. | ### Returns \`Promise\` — Resolves when all routes have been registered successfully. ### Authentication Inherits whatever authentication decorators or hooks are configured on the passed \`FastifyInstance\`. No additional credentials are required by the plugin itself. ### Errors | Condition | Behaviour | |-----------|-----------| | Plugin registration failure | Fastify will throw and reject the returned \`Promise\`. | ### Example \`\`\`ts import Fastify from 'fastify'; import { reposPlugin } from './plugins/repos.js'; const fastify = Fastify({ logger: true }); await fastify.register(reposPlugin); await fastify.listen({ port: 3000 }); \`\`\` --- ## Removed Exports The following symbols were \*\*removed\*\* in this release and are no longer available. Any integrations that depended on them must be updated. | Symbol | Kind | Notes | |--------|------|-------| | \`GitbookFetcher\` | \`class\` | Removed. GitBook content syncing via this class is no longer supported. | | \`GitHubPagesFetcher\` | \`class\` | Removed. GitHub Pages content syncing via this class is no longer supported. | | \`NotionFetcher\` | \`class\` | Removed. Notion content syncing via this class is no longer supported. | | \`getFetcher\` | \`function\` | Removed. The fetcher factory function is no longer available. | | \`SyncResult\` | \`interface\` | Removed. No longer exported from \`./types.js\`. | | \`ContentFetcher\` | \`interface\` | Removed. No longer exported from \`./types.js\`. | ### Migration Guide If your code imported any of the removed symbols, you will need to implement your own content-fetching logic. Example of previously working code that now requires replacement: \`\`\`ts // ❌ No longer works after this release import { getFetcher, type ContentFetcher, type SyncResult } from './fetchers/index.js'; const fetcher: ContentFetcher | null = getFetcher('gitbook'); if (fetcher) { const result: SyncResult = await fetcher.fetch({ spaceId: 'abc123' }); } // ✅ Replace with your own implementation \`\`\` --- ## Internal-Only Changes (Non-Public) The following symbols were modified but are \*\*not exported\*\* and therefore do not affect the public API surface: - \`DOC\_TYPES\` constant — updated to \`\['INTERNAL', 'USER\_FACING', 'API'\] as const\` - \`DocType\` type — derived from the updated \`DOC\_TYPES\` constant - \`isDocType\` guard function — updated to reflect new \`DocType\` values These are internal helpers. Do not rely on them in external integrations. ---