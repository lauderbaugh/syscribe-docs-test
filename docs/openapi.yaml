\## \`config\` \*\*Module:\*\* Environment Configuration --- ### Overview \`config\` is the parsed and validated environment configuration object exported from the environment module. It exposes typed access to environment variables required by the application. The shape of \`config\` is derived from a Zod schema (\`envSchema\`) validated at startup against \`process.env\`. --- ### Export \`\`\`ts export const config: Config \`\`\` --- ### Type: \`Config\` \`\`\`ts type Config = typeof config \`\`\` \`Config\` is the inferred TypeScript type of the \`config\` object. Use it to type function parameters or other references that depend on the application configuration. \*\*Example usage:\*\* \`\`\`ts import { config } from './config'; import type { Config } from './config'; function printConfig(cfg: Config) { console.log(cfg); } printConfig(config); \`\`\` --- ### Behavior When the module loads, it validates \`process.env\` against the internal \`envSchema\` using \`safeParse\`. If validation succeeds, \`config\` holds the fully typed configuration object. If validation fails, \`config\` will be \`undefined\` — you should guard against this in application startup code. > \*\*Note:\*\* Because \`safeParse\` is used rather than \`parse\`, the module does not throw on invalid environment variables. You are responsible for checking that \`config\` is defined before use. --- ### Fields The exact fields available on \`config\` depend on the current \`envSchema\` definition. After this change, \`envSchema\` was modified to include one additional field. Refer to your environment schema source for the full list of validated keys. --- ### Error Conditions | Condition | Result | |---|---| | A required environment variable is missing | \`config\` is \`undefined\` | | An environment variable fails type validation | \`config\` is \`undefined\` | | All environment variables are valid | \`config\` is the fully typed object | --- ### Example \`\`\`ts import { config } from './config'; if (!config) { console.error('Invalid environment configuration. Check your .env file.'); process.exit(1); } // config is fully typed here console.log(config); \`\`\` --- ### Notes - \`envSchema\` and \`parsed\` are internal implementation details and are not part of the public API. - You should import only \`config\` and \`Config\` from this module. - Add any new environment variables to your \`.env\` file before running the application, or \`config\` will be \`undefined\` at runtime.