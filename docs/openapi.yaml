### Modified: `NotionIntegration` (class)

```ts
export class NotionIntegration implements DocIntegration
```

Implements the `DocIntegration` contract. All four public methods were touched in this diff.

#### `private client(): Client`

Lazily constructs or returns the underlying Notion `Client`. Throws if the required credentials are absent from configuration.

* * *

#### `async push(draft, node, deploymentConfig): Promise<DeployResult>`

ParameterTypeDescription`draftApprovedDraft`The approved draft to deploy to Notion`nodeIntegrationNode | null`Existing Notion page node, or `null` for a new page`deploymentConfigRecord<string, unknown>`Target-specific config (page ID, etc.)

**Returns** `DeployResult` — shape defined by the `DocIntegration` interface. On failure, the promise rejects.

* * *

#### `async fetchContentHash(deploymentConfig): Promise<string | null>`

ParameterTypeDescription`deploymentConfigRecord<string, unknown>`Deployment target config identifying the Notion page

**Returns** a content hash string if the page exists and is readable, `null` otherwise (page not found, credentials invalid, or config missing required keys).

* * *

#### `async fetchContent(deploymentConfig): Promise<string | null>`

ParameterTypeDescription`deploymentConfigRecord<string, unknown>`Deployment target config identifying the Notion page

**Returns** the full Markdown-converted content of the target Notion page, or `null` if the page cannot be retrieved. Uses `blockToMarkdown` internally.

