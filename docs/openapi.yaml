## PR Review UI (`app/(dashboard)/review/[commitEventId]/`)

### `DraftDetail` (exported)

```ts
export interface DraftDetail { ... }
```

Describes a single draft within a PR review. Fields include `id`, `status`, `docType`, `baselineContent`, and the generated content. `DraftStatus` and `DocType` within this file are derived from this interface:

```ts
type DraftStatus = DraftDetail["status"];
// DOC_TYPE_LABEL keyed on DraftDetail["docType"]
```

* * *

### `PRReviewData` (exported)

```ts
export interface PRReviewData { ... }
```

Top-level shape returned by `fetchPRReview`. Contains PR metadata and an array of `DraftDetail`.

* * *

### `fetchPRReview`

```ts
async function fetchPRReview(
  token: string,
  commitEventId: string,
): Promise<PRReviewData | { error: string; status: number }>
```

ParameterTypeDescription`tokenstring`Bearer token`commitEventIdstring`Route param identifying the commit event

**Returns** `PRReviewData` on success. On failure, returns `{ error: string; status: number }` — the `status` field carries the HTTP status code, enabling callers to distinguish 404 (not found) from 403 (unauthorised) from 500.

* * *

### `PRReviewEditorProps`

```ts
interface PRReviewEditorProps { ... }
```

Props for the interactive review editor component. Includes `pr: PRReviewData`, `orgId`, and callbacks. Modified in this diff.

* * *

### `statusBadgeVariant` / `statusLabel`

```ts
function statusBadgeVariant(status: DraftStatus): BadgeVariant
function statusLabel(status: DraftStatus): string
```

`BadgeVariant = "blue" | "green" | "purple" | "gray" | "yellow" | "default" | "destructive"`. Both functions are exhaustive maps over `DraftStatus`; no runtime fallback.

