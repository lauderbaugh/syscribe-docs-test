\# API Reference — Draft Review & Activity Feed This reference covers the public and exported symbols introduced or modified in commit \`bea4f0d181dff8028b9e5fefd2a2e4055fe75ee7\`. Internal helpers, unexported constants, and React state hooks are excluded. --- ## Exported Symbols ### \`generateDraftsWorker\` \*\*Type:\*\* \`Worker\` A BullMQ worker instance that processes draft-generation jobs from the Redis-backed queue. When you enqueue a \`GenerateDraftsJobData\` job, this worker picks it up and runs the draft generation pipeline. \*\*Authentication:\*\* Requires a valid Redis connection configured via \`REDIS\_URL\`. \*\*Job data shape (\`GenerateDraftsJobData\`):\*\* > \_Full field-level schema for \`GenerateDraftsJobData\` is not exported; fields are resolved at runtime from the queue payload.\_ \*\*Notes:\*\* - The worker is pre-configured with Phase 1 document types: \`INTERNAL\`, \`USER\_FACING\`, and \`API\`. - You do not instantiate this worker directly; import and register it in your queue consumer entry point. --- ### \`dashboardPlugin\` \`\`\`typescript async function dashboardPlugin(fastify: FastifyInstance): Promise \`\`\` Registers all dashboard-related HTTP routes onto the provided Fastify instance. Call this function during your server bootstrap to expose the dashboard API surface. \*\*Parameters:\*\* | Name | Type | Required | Description | |------|------|----------|-------------| | \`fastify\` | \`FastifyInstance\` | Yes | The Fastify server instance to register routes on. | \*\*Returns:\*\* \`Promise\` \*\*Example:\*\* \`\`\`typescript import Fastify from 'fastify'; import { dashboardPlugin } from './plugins/dashboard'; const app = Fastify(); await app.register(dashboardPlugin); await app.listen({ port: 3001 }); \`\`\` --- ### \`draftsPlugin\` \`\`\`typescript async function draftsPlugin(fastify: FastifyInstance): Promise \`\`\` Registers all draft-management HTTP routes onto the provided Fastify instance. Call this function during your server bootstrap to expose draft CRUD, approval, and deployment endpoints. \*\*Parameters:\*\* | Name | Type | Required | Description | |------|------|----------|-------------| | \`fastify\` | \`FastifyInstance\` | Yes | The Fastify server instance to register routes on. | \*\*Returns:\*\* \`Promise\` \*\*Example:\*\* \`\`\`typescript import Fastify from 'fastify'; import { draftsPlugin } from './plugins/drafts'; const app = Fastify(); await app.register(draftsPlugin); await app.listen({ port: 3001 }); \`\`\` --- ### \`DraftsBanner\` \`\`\`typescript function DraftsBanner({ orgId }: { orgId: string }): JSX.Element \`\`\` A React component that renders a banner summarising pending draft activity for the given organisation. Display this at the top of any page where you want users to see outstanding draft actions. \*\*Parameters:\*\* | Name | Type | Required | Description | |------|------|----------|-------------| | \`orgId\` | \`string\` | Yes | The organisation ID whose draft activity you want to surface. | \*\*Example:\*\* \`\`\`tsx import { DraftsBanner } from '@/components/DraftsBanner'; export default function Layout({ orgId }: { orgId: string }) { return ( <> {/\* rest of layout \*/} ); } \`\`\` --- ### \`DraftRedirectPage\` \`\`\`typescript async function DraftRedirectPage({ params, }: { params: Promise<{ id: string }>; }): Promise \`\`\` A Next.js server component (async page) that resolves a draft by its ID and redirects the user to the correct review URL. Use this as the default export for a dynamic route such as \`/drafts/\[id\]\`. \*\*Parameters:\*\* | Name | Type | Required | Description | |------|------|----------|-------------| | \`params\` | \`Promise<{ id: string }>\` | Yes | The Next.js dynamic route params promise containing the draft \`id\`. | \*\*Error behaviour:\*\* - Returns a \`{ error: string; status: number }\` shaped response if the draft cannot be found or the token is invalid. - Redirects to a 404 page on unresolvable IDs. \*\*Example route file (\`app/drafts/\[id\]/page.tsx\`):\*\* \`\`\`typescript export { DraftRedirectPage as default } from '@/app/drafts/\[id\]/DraftRedirectPage'; \`\`\` --- ### \`DraftDetail\` (interface) \`\`\`typescript export interface DraftDetail { /\* ... \*/ } \`\`\` Describes a fully hydrated draft document returned by the PR review API. You use this type when you consume the \`fetchPRReview\` response. > \_Field-level schema is not exported individually; consume this type from the shared types module.\_ --- ### \`PRReviewData\` (interface) \`\`\`typescript export interface PRReviewData { /\* ... \*/ } \`\`\` The top-level shape returned by \`fetchPRReview\`. It contains a collection of \`DraftDetail\` items and associated PR metadata. Use this type to type-check the response from the PR review endpoint. --- ### \`ActivityItem\` (interface) \`\`\`typescript export interface ActivityItem { /\* ... \*/ } \`\`\` Represents a single row in the activity feed. Each \`ActivityItem\` carries a commit event reference, associated draft summaries, and an \`ActivityStatus\`. Use this type when you render or process dashboard activity lists. --- ## Next.js Configuration ### \`nextConfig\` / \`export default nextConfig\` The updated Next.js configuration object is exported as the default export from \`next.config.\*\`. No direct API call is required; Next.js reads it automatically at build time. --- ## Error Codes The following error shapes appear across \`fetchPRReview\`, \`fetchDraftRef\`, and \`fetchActivity\`: | Condition | Shape | Notes | |-----------|-------|-------| | Authentication failure | \`{ error: string; status: 401 }\` | Token is missing or expired. | | Resource not found | \`{ error: string; status: 404 }\` | The requested draft or PR event does not exist. | | Server error | \`{ error: string; status: 500 }\` | An unexpected error occurred server-side. | | Generic client error | \`{ error: string }\` | Returned by activity fetch on non-HTTP errors. | --- ## Type Reference The following types are used across the exported interfaces. They are not themselves exported but you will encounter them in response shapes. | Type | Values | |------|--------| | \`DraftStatus\` | \`"DRAFT"\` \\| \`"IN\_REVIEW"\` \\| \`"APPROVED"\` \\| \`"DEPLOYED"\` \\| \`"REJECTED"\` \\| \`"FAILED"\` \\| \`"NOT\_APPLICABLE"\` | | \`DocType\` | \`"INTERNAL"\` \\| \`"USER\_FACING"\` \\| \`"API"\` | | \`StatusFilter\` | \`"all"\` \\| \`"pending"\` \\| \`"deployed"\` \\| \`"no\_updates"\` \\| \`"failed"\` | | \`ActivityStatus\` | See \`ActivityItem\` interface |