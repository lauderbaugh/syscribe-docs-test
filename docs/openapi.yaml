\# API Reference — Commit \`9b07c98\` This change introduces the \*\*edit learning pipeline\*\*: vector embeddings of human edits are now stored, retrieved, and injected into generation prompts so the AI learns your team's documentation style over time. It also adds the \`LearningEmbedding\` database model, an \`OpenAIEmbeddingAdapter\`, a new \`embed-learning\` background worker, and wires edit-history retrieval into the draft generation flow. --- ## Core Types ### \`DocType\` \`\`\`ts type DocType = 'INTERNAL' | 'USER\_FACING' | 'API'; \`\`\` Identifies the category of documentation being generated. You pass this value wherever a doc type is required. --- ### \`EmbeddingModel\` \_(interface, new)\_ \`\`\`ts interface EmbeddingModel { embed(text: string): Promise; } \`\`\` Describes any adapter that produces dense vector embeddings. Implement this interface to plug in a custom embedding backend. --- ### \`LearningEmbedding\` \_(type, new)\_ \`\`\`ts type LearningEmbedding = Prisma.LearningEmbeddingModel \`\`\` Represents a stored vector embedding of a human edit signal. The learning pipeline writes these records to Postgres and retrieves them via pgvector cosine similarity at generation time. \*\*Fields\*\* (Prisma model): | Field | Type | Description | |---|---|---| | \`id\` | \`string\` | UUID primary key | | \`orgId\` | \`string\` | Organisation the embedding belongs to | | \`targetId\` | \`string\` | Repo/target the embedding is scoped to | | \`docType\` | \`string\` | Doc type (\`INTERNAL\`, \`USER\_FACING\`, \`API\`) | | \`signalType\` | \`string\` | \`manual\_edit\`, \`agent\_interaction\`, or \`clean\_approval\` | | \`weight\` | \`number\` | Signal strength used during retrieval scoring | | \`content\` | \`string\` | Human-readable text that was embedded | | \`historyEntryId\` | \`string \\| null\` | FK to \`DocumentationHistoryEntry\` | | \`createdAt\` | \`DateTime\` | Creation timestamp | --- ### \`EmbedLearningJobData\` \_(interface, new)\_ \`\`\`ts interface EmbedLearningJobData \`\`\` Payload for jobs pushed to the \`embed-learning\` queue. The worker reads this data to produce and store a \`LearningEmbedding\`. The interface fields are resolved from the job-dispatch call sites; populate the payload with the same fields you pass to the history-write helpers below. --- ### \`EditHistoryExample\` \_(interface)\_ \`\`\`ts interface EditHistoryExample \`\`\` A past human edit retrieved from pgvector similarity search. The generation pipeline injects these examples into the Claude prompt so the model learns your team's style. --- ### \`GenerateDraftsInput\` \_(interface)\_ \`\`\`ts interface GenerateDraftsInput \`\`\` Input to \[\`generateDrafts\`\](#generatedrafts). Wraps the commit event reference, parsed diff, and any retrieved edit-history examples needed to produce documentation drafts. --- ### \`DocDraftResult\` \_(interface)\_ \`\`\`ts interface DocDraftResult \`\`\` Result for a single doc type. Always contains \`content\`; contains \`id\` only when the database write succeeded. | Field | Type | Description | |---|---|---| | \`content\` | \`string\` | Generated markdown content | | \`id\` | \`string \\| undefined\` | Database ID of the persisted \`DocDraft\` record | --- ### \`GenerateDraftsResult\` \_(interface)\_ \`\`\`ts interface GenerateDraftsResult \`\`\` Aggregate result returned by \[\`generateDrafts\`\](#generatedrafts). Contains all generated drafts, the changelog entry, and token usage totals regardless of whether any DB writes failed. --- ## Generation ### \`generateDrafts\` \`\`\`ts async function generateDrafts(input: GenerateDraftsInput): Promise \`\`\` Generates documentation drafts and a changelog entry for a \`CommitEvent\`. \*\*Behaviour:\*\* 1. Generates one \`DocDraft\` per doc type in sequence (\`INTERNAL\`, \`USER\_FACING\`, \`API\`). 2. Persists each draft to Postgres immediately after generation. DB write failures are caught and surfaced in the result — they do not abort remaining generations. 3. Generates a \`ChangelogEntry\` after all doc drafts complete. 4. Returns a \`GenerateDraftsResult\` with all content and aggregate token usage, regardless of whether any DB writes succeeded. \*\*Parameters:\*\* | Parameter | Type | Required | Description | |---|---|---|---| | \`input\` | \`GenerateDraftsInput\` | Yes | Commit event reference, parsed diff, edit history, and configuration | \*\*Returns:\*\* \`Promise\` \*\*TypeScript example:\*\* \`\`\`ts import { generateDrafts } from './generate'; const result = await generateDrafts({ commitEvent: { id: 'evt\_01J...', repoId: 'repo\_01J...', // ... other CommitEventRef fields }, parsedDiff: parsedDiff, editHistory: \[\], // populated by retrieveEditHistory at runtime docTypes: \['INTERNAL', 'USER\_FACING', 'API'\], }); console.log(result.drafts); // DocDraftResult\[\] console.log(result.changelog); // ChangelogEntryResult console.log(result.totalTokens); // aggregate usage \`\`\` --- ## Embedding Adapter ### \`OpenAIEmbeddingAdapter\` \_(class, new)\_ \`\`\`ts class OpenAIEmbeddingAdapter implements EmbeddingModel \`\`\` Embeds text using OpenAI \`text-embedding-3-small\` (1536 dimensions). Requires \`OPENAI\_API\_KEY\` in your environment config. Input is truncated to 24 000 characters (\`EMBED\_MAX\_CHARS\`) before sending, preserving the first 60% and last 40% of the allowed window so structural and diff signals are both retained. \*\*Constructor:\*\* \`\`\`ts constructor() \`\`\` Reads \`OPENAI\_API\_KEY\` from config at instantiation time. --- #### \`OpenAIEmbeddingAdapter.embed\` \`\`\`ts async embed(text: string): Promise \`\`\` Embeds the supplied text and returns a 1536-dimension float array. \*\*Parameters:\*\* | Parameter | Type | Required | Description | |---|---|---|---| | \`text\` | \`string\` | Yes | The text to embed. Truncated to \`EMBED\_MAX\_CHARS\` before the API call. | \*\*Returns:\*\* \`Promise\` — A 1536-element array of floating-point values. \*\*TypeScript example:\*\* \`\`\`ts import { OpenAIEmbeddingAdapter } from './adapters/openai-embedding'; const embedder = new OpenAIEmbeddingAdapter(); const vector = await embedder.embed('Update the authentication section to describe OAuth 2.0.'); console.log(vector.length); // 1536 \`\`\` \*\*Error conditions:\*\* | Condition | Behaviour | |---|---| | \`OPENAI\_API\_KEY\` missing | Throws at construction time when config validation fails | | OpenAI API error | Propagates the underlying API error to the caller | --- ## Background Workers ### \`embedLearningWorker\` \_(new)\_ \`\`\`ts export const embedLearningWorker = new Worker(...) \`\`\` BullMQ worker that consumes jobs from the \`embed-learning\` queue. For each job it: 1. Formats the edit signal into embeddable text. 2. Calls \`OpenAIEmbeddingAdapter.embed\`. 3. Writes the resulting vector to the \`LearningEmbedding\` table via raw SQL (\`pgvector\`). 4. Links the embedding back to the originating \`DocumentationHistoryEntry\`. The worker handles \`manual\_edit\`, \`agent\_interaction\`, and \`clean\_approval\` signal types. Clean-approval embeddings are stored but not injected into generation prompts. --- ### \`generateDraftsWorker\` \_(updated)\_ \`\`\`ts export const generateDraftsWorker = new Worker(...) \`\`\` BullMQ worker that consumes jobs from the \`generate-drafts\` queue. This worker now calls \[\`retrieveEditHistory\`\](#retrieveedithistory) before invoking \[\`generateDrafts\`\](#generatedrafts), so edit examples from pgvector are automatically injected into every generation prompt. --- ## Queues ### \`embedLearningQueue\` \_(new)\_ \`\`\`ts export const embedLearningQueue = new Queue('embed-learning', { connection }); \`\`\` BullMQ queue for embedding jobs. Push a job here whenever a human edit signal should be learned from (i.e. after a manual edit, agent interaction, or clean approval event). \*\*TypeScript example:\*\* \`\`\`ts import { embedLearningQueue } from './queues'; await embedLearningQueue.add('embed', { orgId: 'org\_01J...', targetId: 'repo\_01J...', docType: 'API', signalType: 'manual\_edit', historyEntryId: 'hist\_01J...', // ... other EmbedLearningJobData fields }); \`\`\` --- ## History Write Helpers These helpers write structured entries to \`DocumentationHistoryEntry\`. Each returns \`void\` unless the entry ID is needed downstream, in which case the function is \`async\` and returns \`Promise\`. --- ### \`writeAgentInteraction\` \`\`\`ts async function writeAgentInteraction(params: { orgId: string; commitEventId?: string | null; docDraftId: string; targetId?: string | null; docType: string; userId: string; instruction: string; draftBefore: string; draftAfter: string; }): Promise \`\`\` Writes an \`AGENT\_INTERACTION\` history entry and returns its ID. Await this when you need the entry ID to link to a \`LearningEmbedding\`. Always resolves — never throws. \*\*Parameters:\*\* | Parameter | Type | Required | Description | |---|---|---|---| | \`orgId\` | \`string\` | Yes | Organisation ID | | \`commitEventId\` | \`string \\| null\` | No | Associated commit event | | \`docDraftId\` | \`string\` | Yes | Draft being edited | | \`targetId\` | \`string \\| null\` | No | Repo/target ID | | \`docType\` | \`string\` | Yes | Doc type being edited | | \`userId\` | \`string\` | Yes | User who issued the instruction | | \`instruction\` | \`string\` | Yes | The natural-language instruction | | \`draftBefore\` | \`string\` | Yes | Draft content before the interaction | | \`draftAfter\` | \`string\` | Yes | Draft content after the interaction | \*\*Returns:\*\* \`Promise\` — The new history entry ID, or \`null\` on DB error. --- ### \`writeApprovalGranted\` \`\`\`ts async function writeApprovalGranted(params: { orgId: string; commitEventId?: string | null; docDraftId: string; targetId?: string | null; docType: string; userId: string; finalContent: string; diffFromGenerated: string; }): Promise \`\`\` Writes an \`APPROVAL\_GRANTED\` history entry and returns its ID. Await this when you need the entry ID for a \`LearningEmbedding\` link. Always resolves — never throws. \*\*Parameters:\*\* | Parameter | Type | Required | Description | |---|---|---|---| | \`orgId\` | \`string\` | Yes | Organisation ID | | \`commitEventId\` | \`string \\| null\` | No | Associated commit event | | \`docDraftId\` | \`string\` | Yes | Draft being approved | | \`targetId\` | \`string \\| null\` | No | Repo/target ID | | \`docType\` | \`string\` | Yes | Doc type being approved | | \`userId\` | \`string\` | Yes | Approving user | | \`finalContent\` | \`string\` | Yes | The approved documentation content | | \`diffFromGenerated\` | \`string\` | Yes | Diff between AI-generated and approved content | \*\*Returns:\*\* \`Promise\` — The new history entry ID, or \`null\` on DB error. --- ### \`writeDraftGenerated\` \`\`\`ts function writeDraftGenerated(params: { orgId: string; commitEventId: string; docDraftId: string; targetId?: string | null; docType: string; model: string; inputTokens: number; outputTokens: number; resolvedDirection: string | null; baselineUsed: boolean; stalenessCheckResult: 'cache\_hit' | 'drift\_detected' | 'no\_cache'; }): void \`\`\` Fires-and-forgets a \`DRAFT\_GENERATED\` history entry. Use this immediately after a successful draft generation. --- ### \`writeDraftNotApplicable\` \`\`\`ts function writeDraftNotApplicable(params: { orgId: string; commitEventId: string; docDraftId: string; targetId?: string | null; docType: string; reasoning: string; }): void \`\`\` Records that a doc type was skipped because the commit is not relevant to it. --- ### \`writeManualEdit\` \`\`\`ts function writeManualEdit(params: { orgId: string; commitEventId?: string | null; docDraftId: string; targetId?: string | null; docType: string; userId: string; diffHtml: string; }): void \`\`\` Records a manual in-editor change to a draft. --- ### \`writeApprovalBulkGranted\` \`\`\`ts function writeApprovalBulkGranted(params: { orgId: string; commitEventId?: string | null; userId: string; approvedDocTypes: string\[\]; }): void \`\`\` Records a bulk approval across multiple doc types in a single history entry. --- ### \`writeApprovalRejected\` \`\`\`ts function writeApprovalRejected(params: { orgId: string; commitEventId?: string | null; docDraftId: string; targetId?: string | null; docType: string; userId: string; reason: string; }): void \`\`\` Records that a draft was rejected by a reviewer. --- ### \`writeDeploymentSucceeded\` \`\`\`ts function writeDeploymentSucceeded(params: { orgId: string; commitEventId?: string | null; docDraftId: string; targetId?: string | null; docType: string; externalDocId: string | null; targetUrl: string | null; }): void \`\`\` Records a successful deployment of a draft to an external documentation target. --- ### \`writeDeploymentFailed\` \`\`\`ts function writeDeploymentFailed(params: { orgId: string; commitEventId?: string | null; docDraftId: string; targetId?: string | null; docType: string; errorMessage: string; retryCount: number; }): void \`\`\` Records a deployment failure with the error message and current retry count. --- ## Internal: Edit History Retrieval ### \`retrieveEditHistory\` \_(internal, used by \`generateDraftsWorker\`)\_ \`\`\`ts async function retrieveEditHistory( orgId: string, repoId: string, parsedDiff: ParsedDiff, repoDocConfigs: Array<{ id: string; docType: string }>, ): Promise \`\`\` Retrieves past edit examples from pgvector for each doc type being generated. For each doc type, embeds a short context string and runs a cosine similarity query against \`LearningEmbedding\`, filtered by \`orgId × targetId × docType\`. Returns the top-5 \`manual\_edit\` and top-5 \`agent\_interaction\` examples per doc type. Clean-approval embeddings are fetched but excluded from the returned array. Always returns a (possibly empty) array — never throws. An empty result is valid on first run before any human edits exist. --- ## Deprecated ### \`DocBaseline